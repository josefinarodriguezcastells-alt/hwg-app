<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HWG Talent — Perfil de candidato</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F4F8; font-family: 'DM Sans', sans-serif; color: #111827; padding: 2rem 1rem 4rem; }

    .page { max-width: 720px; margin: 0 auto; }

    /* HEADER */
    .header { background: #3C3489; border-radius: 14px; padding: 1.5rem 2rem; margin-bottom: 1.25rem; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .header-tag { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: #CECBF6; text-transform: uppercase; margin-bottom: 6px; }
    .header-name { font-size: 26px; font-weight: 600; color: #fff; line-height: 1.2; margin-bottom: 4px; }
    .header-role { font-size: 14px; color: #AFA9EC; }
    .header-right { text-align: right; flex-shrink: 0; margin-left: 1rem; }
    .header-client-label { font-size: 11px; color: #CECBF6; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
    .header-client-name { font-size: 15px; font-weight: 500; color: #fff; }
    .header-client-company { font-size: 13px; color: #AFA9EC; margin-top: 2px; }
    .header-date { font-size: 12px; color: #AFA9EC; margin-top: 6px; }

    .rec-badge { display: inline-block; margin-top: 10px; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 500; }
    .rec-green { background: rgba(15,110,86,0.35); color: #6EE7B7; }
    .rec-amber { background: rgba(0,0,0,0.25); color: #FAC775; }
    .rec-red   { background: rgba(180,30,30,0.35); color: #FCA5A5; }

    .header-contact { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding-top: 1rem; border-top: 0.5px solid rgba(255,255,255,0.15); }
    .hc-item { display: flex; flex-direction: column; gap: 3px; }
    .hc-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #CECBF6; }
    .hc-value { font-size: 12px; color: #fff; word-break: break-all; }
    .hc-value a { color: #CECBF6; text-decoration: underline; }

    /* SECCIONES */
    .section { margin-bottom: 1.25rem; background: #fff; border-radius: 12px; padding: 1.25rem 1.5rem; border: 0.5px solid #E5E7EB; }
    .section-title { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7280; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 0.5px solid #E5E7EB; }

    /* EVALUACIÓN */
    .eval-wrap { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: center; }
    .fit-score-block { text-align: center; background: #F5F4F8; border-radius: 10px; padding: 16px 20px; min-width: 100px; }
    .fit-score-num { font-size: 40px; font-weight: 600; color: #534AB7; line-height: 1; }
    .fit-score-den { font-size: 13px; color: #6B7280; margin-top: 2px; }
    .fit-score-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6B7280; margin-top: 8px; }

    .fit-criteria { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .criterion { display: flex; flex-direction: column; gap: 5px; }
    .criterion-header { display: flex; justify-content: space-between; align-items: center; }
    .criterion-label { font-size: 12px; color: #374151; }
    .criterion-pts { font-size: 11px; color: #6B7280; }
    .dots { display: flex; gap: 5px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #E5E7EB; }
    .dot.low  { background: #E24B4A; }
    .dot.mid  { background: #BA7517; }
    .dot.high { background: #3B6D11; }

    .snap-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .snap-card { background: #F5F4F8; border-radius: 8px; padding: 12px; text-align: center; }
    .snap-label { font-size: 11px; color: #6B7280; margin-bottom: 5px; }
    .snap-value { font-size: 15px; font-weight: 500; color: #111827; }
    .snap-value.green { color: #0F6E56; }

    /* RECRUITER */
    .story-box { background: #EEEDFE; border-left: 3px solid #534AB7; border-radius: 0 8px 8px 0; padding: 14px 16px; font-size: 14px; line-height: 1.75; color: #3C3489; }

    /* GAPS */
    .gap-list { display: flex; flex-direction: column; gap: 12px; }
    .gap-item { border-left: 2px solid #E24B4A; padding-left: 12px; }
    .gap-title { font-size: 13px; font-weight: 500; color: #A32D2D; margin-bottom: 3px; }
    .gap-detail { font-size: 13px; color: #6B7280; line-height: 1.55; }

    /* STACK */
    .tools-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .tool-chip { background: #F5F4F8; border: 0.5px solid #E5E7EB; border-radius: 20px; padding: 5px 13px; font-size: 13px; color: #374151; }

    /* TRAYECTORIA */
    .exp-list { display: flex; flex-direction: column; gap: 12px; }
    .exp-item { display: flex; flex-direction: column; gap: 2px; }
    .exp-role { font-size: 14px; font-weight: 500; color: #111827; }
    .exp-meta { font-size: 12px; color: #6B7280; }

    /* FIT CULTURAL */
    .cult-box { background: #F5F3FF; border-left: 3px solid #7C3AED; border-radius: 0 8px 8px 0; padding: 14px 16px; font-size: 14px; line-height: 1.75; color: #3C3489; }
    .cult-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .cult-tag { background: #EDE9FE; border: 0.5px solid #C4B5FD; border-radius: 20px; padding: 3px 11px; font-size: 11px; color: #5B21B6; font-weight: 500; }

    /* FOOTER */
    .footer { margin-top: 1.5rem; padding-top: 12px; border-top: 0.5px solid #E5E7EB; display: flex; justify-content: space-between; align-items: center; }
    .footer-brand { font-size: 12px; font-weight: 500; color: #6B7280; }
    .footer-url { font-size: 12px; color: #534AB7; }
    .footer-date { font-size: 12px; color: #6B7280; }

    /* NOTA FIT */
    .fit-note { margin-top: 1.25rem; font-size: 11px; color: #9CA3AF; line-height: 1.75; }
    .fit-note strong { font-weight: 500; color: #6B7280; }

    /* LOADING / ERROR */
    .state-box { text-align: center; padding: 4rem 2rem; color: #6B7280; font-size: 15px; }
    .spinner { width: 32px; height: 32px; border: 2px solid #E5E7EB; border-top-color: #534AB7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .header-contact { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .eval-wrap { grid-template-columns: 1fr; }
      .fit-score-block { width: 100%; }
      .snap-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .header-top { flex-direction: column; gap: 1rem; }
      .header-right { text-align: left; }
    }
  </style>
</head>
<body>
<div class="page" id="app">
  <div class="state-box"><div class="spinner"></div>Cargando perfil...</div>
</div>

<script>
let SUPABASE_URL = '';
let SUPABASE_ANON_KEY = '';

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    SUPABASE_URL = cfg.supabaseUrl;
    SUPABASE_ANON_KEY = cfg.supabaseKey;
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="state-box">Error de configuración. Contactá a HWG.</div>';
  }
}

function getToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get('token');
}

function recClass(rec) {
  if (!rec) return 'rec-amber';
  const r = rec.toLowerCase();
  if (r.includes('no recom')) return 'rec-red';
  if (r.includes('cautela')) return 'rec-amber';
  return 'rec-green';
}

function dots(filled, total, colorClass) {
  let html = '<div class="dots">';
  for (let i = 0; i < total; i++) {
    html += `<div class="dot ${i < filled ? colorClass : ''}"></div>`;
  }
  html += '</div>';
  return html;
}

function dotColor(pts, max) {
  const ratio = pts / max;
  if (ratio >= 0.67) return 'high';
  if (ratio >= 0.34) return 'mid';
  return 'low';
}

// Etiquetas fijas del molde del informe (títulos de sección, header, footer).
// El texto libre (storytelling, gaps, análisis) ya sale en el idioma elegido
// porque lo genera Claude en ese idioma — esto traduce lo que Claude no
// escribe: el molde alrededor. `lang` viaja en profile_data desde que el
// recruiter lo generó (hwg_ats InformeInline.jsx); los informes publicados
// antes de ese cambio no lo tienen, así que caen en 'es' (mismo texto que
// siempre mostraron, sin regresión).
const COPY = {
  es: {
    presentedFor: 'Presentado para',
    phone: 'Teléfono',
    salaryExpectation: 'Pretensión salarial',
    evaluation: 'Evaluación del candidato',
    outOf10: 'de 10',
    techFit: 'Fit técnico',
    critExpRol: 'Experiencia en el rol',
    critStack: 'Stack y herramientas',
    critSeniority: 'Seniority vs posición',
    critLogros: 'Logros medibles relevantes',
    english: 'Inglés',
    availability: 'Disponibilidad',
    yearsExp: 'Años de experiencia',
    recruiterAnalysis: 'Análisis del recruiter',
    recruiterTake: 'Mirada del recruiter',
    gaps: 'Gaps a tener en cuenta',
    stack: 'Stack técnico',
    trajectory: 'Trayectoria profesional',
    culturalFit: '🧬 Fit cultural',
    pageTitle: 'HWG Talent — Perfil de candidato',
    fitNote: '* <strong>Cómo se calcula el fit técnico:</strong> el puntaje del 1 al 10 se construye sobre cuatro criterios evaluados contra la job description: experiencia directa en el rol (0–3 pts), dominio de herramientas y stack requerido (0–3 pts), nivel de seniority vs lo que pide la posición (0–2 pts), y logros medibles relevantes para el puesto (0–2 pts). Un puntaje de 7 o más indica recomendación para entrevistar. Entre 5 y 6, perfil a evaluar con cautela. Por debajo de 5, no recomendado para esta posición.',
    recommendation: {
      'Recomendado/a para entrevistar': 'Recomendado/a para entrevistar',
      'Perfil a evaluar con cautela': 'Perfil a evaluar con cautela',
      'No recomendado/a para esta posición': 'No recomendado/a para esta posición',
    },
    dateLocale: 'es-AR',
  },
  en: {
    presentedFor: 'Submitted for',
    phone: 'Phone',
    salaryExpectation: 'Salary expectation',
    evaluation: 'Candidate evaluation',
    outOf10: 'out of 10',
    techFit: 'Technical fit',
    critExpRol: 'Experience in the role',
    critStack: 'Stack and tools',
    critSeniority: 'Seniority vs. position',
    critLogros: 'Relevant measurable achievements',
    english: 'English',
    availability: 'Availability',
    yearsExp: 'Years of experience',
    recruiterAnalysis: "Recruiter's analysis",
    recruiterTake: "Recruiter's take",
    gaps: 'Gaps to keep in mind',
    stack: 'Technical stack',
    trajectory: 'Professional background',
    culturalFit: '🧬 Cultural fit',
    pageTitle: 'HWG Talent — Candidate profile',
    fitNote: "* <strong>How the technical fit score is calculated:</strong> the 1-to-10 score is built from four criteria evaluated against the job description: direct experience in the role (0–3 pts), command of the required tools and stack (0–3 pts), seniority level vs. what the position requires (0–2 pts), and measurable achievements relevant to the role (0–2 pts). A score of 7 or higher means recommended for interview. 5–6 means a profile to evaluate with caution. Below 5 means not recommended for this position.",
    recommendation: {
      'Recomendado/a para entrevistar': 'Recommended for interview',
      'Perfil a evaluar con cautela': 'Profile to evaluate with caution',
      'No recomendado/a para esta posición': 'Not recommended for this position',
    },
    dateLocale: 'en-US',
  },
};

function renderProfile(p) {
  const d = p.profile_data;
  const t = COPY[d.lang === 'en' ? 'en' : 'es'];
  document.documentElement.lang = d.lang === 'en' ? 'en' : 'es';
  document.title = t.pageTitle;

  const today = new Date(p.published_at || Date.now())
    .toLocaleDateString(t.dateLocale, { day: '2-digit', month: 'long', year: 'numeric' });

  const criteria = d.fitCriteria || {
    expRol: 0, stack: 0, seniority: 0, logros: 0
  };

  const techFitNum = parseInt(d.snapshot?.techFit) || 0;

  const gapItems = Array.isArray(d.gap)
    ? d.gap
    : (d.gap ? [{ title: 'Gap', detail: d.gap }] : []);

  const tools = Array.isArray(d.tools) ? d.tools : [];
  const experience = Array.isArray(d.experience) ? d.experience : [];

  // El recruiter siempre elige la recomendación de un dropdown en español
  // (ResultEditor.jsx) — el dato guardado no cambia con el idioma, solo lo
  // que se muestra acá.
  const recommendationText = t.recommendation[d.recommendation] || d.recommendation || '';

  const contactItems = [
    { label: 'LinkedIn', value: d.personal?.linkedin, isLink: true },
    { label: t.phone, value: d.personal?.phone },
    { label: 'Email', value: d.personal?.email },
    { label: t.salaryExpectation, value: d.personal?.salary },
  ];

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-tag">HWG Talent Consultants</div>
          <div class="header-name">${d.name || ''}</div>
          <div class="header-role">${d.role || ''}${d.location ? ' &nbsp;·&nbsp; ' + d.location : ''}</div>
          <span class="rec-badge ${recClass(d.recommendation)}">${recommendationText}</span>
        </div>
        <div class="header-right">
          <div class="header-client-label">${t.presentedFor}</div>
          <div class="header-client-name">${d.role || ''}</div>
          <div class="header-client-company">${d.personal?.clientCompany || d.personal?.company || ''}</div>
          <div class="header-date">${today}</div>
        </div>
      </div>
      <div class="header-contact">
        ${contactItems.map(c => `
          <div class="hc-item">
            <span class="hc-label">${c.label}</span>
            <span class="hc-value">
              ${c.isLink && c.value ? `<a href="${c.value.startsWith('http') ? c.value : 'https://' + c.value}" target="_blank">${c.value.replace('https://','').replace('http://','')}</a>` : (c.value || '—')}
            </span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">${t.evaluation}</div>
      <div class="eval-wrap">
        <div class="fit-score-block">
          <div class="fit-score-num">${techFitNum}</div>
          <div class="fit-score-den">${t.outOf10}</div>
          <div class="fit-score-label">${t.techFit}</div>
        </div>
        <div class="fit-criteria">
          <div class="criterion">
            <div class="criterion-header">
              <span class="criterion-label">${t.critExpRol}</span>
              <span class="criterion-pts">${criteria.expRol} / 3</span>
            </div>
            ${dots(criteria.expRol, 3, dotColor(criteria.expRol, 3))}
          </div>
          <div class="criterion">
            <div class="criterion-header">
              <span class="criterion-label">${t.critStack}</span>
              <span class="criterion-pts">${criteria.stack} / 3</span>
            </div>
            ${dots(criteria.stack, 3, dotColor(criteria.stack, 3))}
          </div>
          <div class="criterion">
            <div class="criterion-header">
              <span class="criterion-label">${t.critSeniority}</span>
              <span class="criterion-pts">${criteria.seniority} / 2</span>
            </div>
            ${dots(criteria.seniority, 2, dotColor(criteria.seniority, 2))}
          </div>
          <div class="criterion">
            <div class="criterion-header">
              <span class="criterion-label">${t.critLogros}</span>
              <span class="criterion-pts">${criteria.logros} / 2</span>
            </div>
            ${dots(criteria.logros, 2, dotColor(criteria.logros, 2))}
          </div>
        </div>
      </div>
      <div class="snap-row">
        <div class="snap-card">
          <div class="snap-label">${t.english}</div>
          <div class="snap-value ${(d.snapshot?.englishLevel || '').toLowerCase().includes('avan') ? 'green' : ''}">${d.snapshot?.englishLevel || '—'}</div>
        </div>
        <div class="snap-card">
          <div class="snap-label">${t.availability}</div>
          <div class="snap-value">${d.personal?.availability || '—'}</div>
        </div>
        <div class="snap-card">
          <div class="snap-label">${t.yearsExp}</div>
          <div class="snap-value">${d.snapshot?.exp || '—'}</div>
        </div>
      </div>
    </div>

    ${d.analisis ? `
    <div class="section">
      <div class="section-title">${t.recruiterAnalysis}</div>
      <div class="story-box" style="background:#f0fdf4;border-left-color:#0F6E56;color:#065F46;">${d.analisis}</div>
    </div>` : ''}

    ${d.storytelling ? `
    <div class="section">
      <div class="section-title">${t.recruiterTake}</div>
      <div class="story-box">${d.storytelling}</div>
    </div>` : ''}

    ${gapItems.length > 0 ? `
    <div class="section">
      <div class="section-title">${t.gaps}</div>
      <div class="gap-list">
        ${gapItems.map(g => `
          <div class="gap-item">
            <div class="gap-title">${g.title || ''}</div>
            <div class="gap-detail">${g.detail || ''}</div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${tools.length > 0 ? `
    <div class="section">
      <div class="section-title">${t.stack}</div>
      <div class="tools-wrap">
        ${tools.map(tl => `<span class="tool-chip">${tl.tool}${tl.years ? ' · ' + tl.years : ''}</span>`).join('')}
      </div>
    </div>` : ''}

    ${experience.length > 0 ? `
    <div class="section">
      <div class="section-title">${t.trajectory}</div>
      <div class="exp-list">
        ${experience.map(e => `
          <div class="exp-item">
            <div class="exp-role">${e.role || ''}</div>
            <div class="exp-meta">${e.company || ''}${e.period ? ' &nbsp;·&nbsp; ' + e.period : ''}</div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${(d.fitCultural && d.fitCultural.trim()) ? `
    <div class="section">
      <div class="section-title">${t.culturalFit}</div>
      ${(d.culturalTags && d.culturalTags.length > 0) ? `
      <div class="cult-tags">
        ${d.culturalTags.map(ct => `<span class="cult-tag">${ct}</span>`).join('')}
      </div>` : ''}
      <div class="cult-box">${d.fitCultural}</div>
    </div>` : ''}

    <div class="footer">
      <span class="footer-brand">HWG Talent Consultants</span>
      <span class="footer-url">www.hwgtalent.com</span>
      <span class="footer-date">${today}</span>
    </div>

    <div class="fit-note">
      ${t.fitNote}
    </div>
  `;
}

async function markViewed(token) {
  try {
    await fetch(`/api/presentation?token=${encodeURIComponent(token)}`, {
      method: 'PATCH',
    });
  } catch(e) { /* silencioso */ }
}

async function init() {
  await loadConfig();
  if (!SUPABASE_URL) return;
  const token = getToken();
  if (!token) {
    document.getElementById('app').innerHTML = '<div class="state-box">Link inválido. No se encontró el perfil.</div>';
    return;
  }

  try {
    // Vía el backend (service key, nunca expuesta acá) en vez de pegarle
    // directo a Supabase con la clave anónima — antes esta página traía
    // además un "secreto" hardcodeado en el HTML, visible con Ver código
    // fuente, así que nunca fue realmente secreto (hallazgo de seguridad
    // 2026-09-22, ver AGENTS.md).
    const res = await fetch(`/api/presentation?token=${encodeURIComponent(token)}`);
    if (!res.ok) {
      document.getElementById('app').innerHTML = '<div class="state-box">Perfil no encontrado o link expirado.</div>';
      return;
    }
    const presentation = await res.json();
    renderProfile(presentation);
    markViewed(token);
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="state-box">Error cargando el perfil: ${e.message}</div>`;
  }
}

init();
</script>
</body>
</html>
