// ── RECRUITER PROFILE ─────────────────────────────────────────────────────────
function RecruiterPositionsView({ user, onBack }) {

  const [apps,setApps]=useState([]);

  const [candProfile,setCandProfile]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    (async()=>{
      const {data:pr}=await supabase.from('position_recruiters').select('position_id').eq('recruiter_id',user.id);
      const ids=(pr||[]).map(p=>p.position_id);
      const [{data:cl},{data:us},{data:ap},{data:allPos}]=await Promise.all([
        supabase.from('clients').select('*'),
        supabase.from('users').select('*'),
        supabase.from('applications').select('*, candidates(*), positions(role,status,clients(name))').eq('recruiter_id',user.id).order('last_updated',{ascending:false}),
        supabase.from('positions').select('*, clients(name)')
      ]);

        const {data:pos}=await supabase.from('positions').select('*, clients(name,stakeholder)').in('id',ids).order('opened_at',{ascending:false});
        setPositions(pos||[]);
      }
      setClients(cl||[]); setAllUsers(us||[]); setApps(ap||[]); setAllPositions(allPos||[]);
      setLoading(false);
    })();
  },[user.id]);

  if (detail) return <PositionDetail positionId={detail} user={{role:'owner',id:user.id}} users={allUsers} onBack={()=>setDetail(null)} clients={clients} onRefresh={()=>{}}/>;
  if (candProfile) return <CandidateProfile candidate={candProfile} onBack={()=>setCandProfile(null)} currentUser={{role:'owner',id:user.id}} allPositions={allPositions}/>;
  if (loading) return <div className="loading">Cargando...</div>;

  const hired = apps.filter(a=>a.status==='hired');
  const active = apps.filter(a=>!['hired','rechazado_salario','rechazado_tech','rechazado_location'].includes(a.status));
  const daysSince = user.created_at ? Math.floor((Date.now()-new Date(user.created_at))/86400000) : null;

  return (

              {user.email}
              {daysSince!==null && <span style={{marginLeft:12}}>· Alta hace {daysSince} días</span>}
            </div>
          </div>
          <span className="badge badge-active">recruiter</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginTop:24}}>
          {[
            {num:positions.length,label:'Posiciones asignadas'},
            {num:apps.length,label:'Candidatos totales'},
            {num:active.length,label:'Candidatos activos'},
            {num:hired.length,label:'Hires cerrados',highlight:true},
          ].map(s=>(
            <div key={s.label} style={{background:'var(--card)',border:'1px solid var(--border)',padding:'16px 20px'}}>
              <div style={{fontSize:28,fontWeight:800,color:s.highlight?'var(--lime)':'#f0f0f0',lineHeight:1}}>{s.num}</div>
              <div style={{fontSize:10,color:'var(--muted)',letterSpacing:2,textTransform:'uppercase',marginTop:6}}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="section-title" style={{marginBottom:12}}>Posiciones asignadas ({positions.length})</div>
      {positions.length===0

        : <table className="data-table" style={{marginBottom:36}}>

              <tr key={p.id} onClick={()=>setDetail(p.id)} style={{cursor:'pointer'}}>
                <td><span className="client-name">{p.clients?.name}</span></td>
                <td>{p.role}</td>

      {hired.length>0&&(

          <div className="section-title" style={{marginBottom:12,color:'var(--lime)'}}>✓ Hires cerrados ({hired.length})</div>

                <div>
                  <div className="candidate-name" style={{color:'var(--lime)'}}>{a.candidates?.name} ↗</div>

            <option value="owner">Owner</option><option value="recruiter">Recruiter</option><option value="client">Client</option>
          </select>
          <label className="field-label">Contraseña</label><input className="field-input" value={form.password} onChange={e=>set('password',e.target.value)} placeholder="••••••••" type="password"/>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
            <button className="btn-primary" onClick={save}>Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

  const [detail,setDetail]=useState(null);
  const [allUsers,setAllUsers]=useState([]);
  const [loading,setLoading]=useState(true);

  const parseStakeholders = (raw) => {
    if (!raw) return [];
    try { const p=JSON.parse(raw); return Array.isArray(p)?p:[{name:raw,contact:''}]; }
    catch(e) { return [{name:raw,contact:''}]; }
  };

  useEffect(()=>{
    (async()=>{
      let cl = null;
      if (user.client_id) {
        const {data} = await supabase.from('clients').select('*').eq('id',user.client_id).single();
        cl = data;
      } else {
        const {data} = await supabase.from('clients').select('*').eq('name',user.name).single();
        cl = data;
      }
      if (!cl) { setLoading(false); return; }
      setClient(cl);

      const [{data:pos},{data:us}] = await Promise.all([
        supabase.from('positions').select('*, applications(*, candidates(name), users(name)), position_recruiters(recruiter_id, users(name))').eq('client_id',cl.id).order('opened_at',{ascending:false}),
        supabase.from('users').select('*')
      ]);
      setPositions(pos||[]);
      setAllUsers(us||[]);

      const recMap = {};
      (pos||[]).forEach(p=>{
        (p.position_recruiters||[]).forEach(pr=>{
          if (pr.users) recMap[pr.recruiter_id] = pr.users.name;
        });
      });
      setRecruiters(Object.entries(recMap).map(([id,name])=>({id,name})));
      setLoading(false);
    })();
  },[user.name, user.client_id]);

  if (detail) return <PositionDetail positionId={detail} user={{role: onBack?'owner':'client', id:user.id}} users={allUsers} onBack={()=>setDetail(null)} clients={client?[client]:[]} onRefresh={()=>{}}/>;
  if (loading) return <div className="loading">Cargando...</div>;
  if (!client) return <div className="empty-state">Cliente no encontrado</div>;

  const stakeholders = parseStakeholders(client.stakeholder);
  const active = positions.filter(p=>p.status==='active');
  const onHold = positions.filter(p=>p.status==='on_hold');
  const closed = positions.filter(p=>['closed','cancelled'].includes(p.status));
  const totalHires = positions.reduce((acc,p)=>(
    acc + (p.applications||[]).filter(a=>a.status==='hired').length
  ),0);
  const daysSince = client.created_at ? Math.floor((Date.now()-new Date(client.created_at))/86400000) : null;

  const PositionBlock = ({title, list, color}) => list.length===0?null:(
    <div style={{marginBottom:36}}>
      <div className="section-title" style={{marginBottom:12,color:color||'#f0f0f0'}}>{title} ({list.length})</div>
      <table className="data-table">
        <thead><tr><th>Rol</th><th>Recruiters</th><th>Candidatos</th><th>Hires</th><th>Abierta</th><th>Estado</th></tr></thead>
        <tbody>{list.map(p=>{
          const recs=(p.position_recruiters||[]).map(pr=>pr.users?.name).filter(Boolean);
          const hires=(p.applications||[]).filter(a=>a.status==='hired').length;
          return (
            <tr key={p.id} onClick={()=>setDetail(p.id)} style={{cursor:'pointer'}}>
              <td><span className="client-name">{p.role}</span><div style={{fontSize:11,color:'var(--muted)'}}>{p.location}</div></td>
              <td style={{fontSize:11,color:'var(--muted)'}}>{recs.join(', ')||'—'}</td>
              <td style={{fontWeight:600,color:'var(--lime)'}}>{(p.applications||[]).length}</td>
              <td style={{fontWeight:700,color:hires>0?'var(--lime)':'#444'}}>{hires||'—'}</td>
              <td style={{color:'var(--muted)',fontSize:11}}>{p.opened_at?.slice(0,10)}</td>
              <td><StatusBadge status={p.status}/></td>
            </tr>
          );
        })}</tbody>
      </table>
    </div>
  );

  return (
    <div>
      {onBack&&<div className="back-btn" onClick={onBack}>← Volver al equipo</div>}
      <div className="detail-header">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div className="page-title">{client.name}</div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:4,letterSpacing:1}}>
              {daysSince!==null&&<span>Cliente desde hace {daysSince} días</span>}
            </div>
          </div>
          <StatusBadge status={client.status}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginTop:24,marginBottom:client.notes?20:0}}>
          {[
            {num:positions.length, label:'Posiciones totales'},
            {num:active.length, label:'Posiciones activas'},
            {num:recruiters.length, label:'Recruiters asignados'},
            {num:totalHires, label:'Hires cerrados', highlight:true},
          ].map(s=>(
            <div key={s.label} style={{background:'var(--card)',border:'1px solid var(--border)',padding:'16px 20px'}}>
              <div style={{fontSize:28,fontWeight:800,color:s.highlight?'var(--lime)':'#f0f0f0',lineHeight:1}}>{s.num}</div>
              <div style={{fontSize:10,color:'var(--muted)',letterSpacing:2,textTransform:'uppercase',marginTop:6}}>{s.label}</div>
            </div>
          ))}
        </div>
        {client.notes&&<div style={{fontSize:12,color:'var(--sub)',padding:'12px 16px',background:'var(--card)',border:'1px solid var(--border)',marginTop:16}}>{client.notes}</div>}
      </div>

      {stakeholders.length>0&&(
        <div style={{marginBottom:32}}>
          <div className="section-title" style={{marginBottom:12}}>Stakeholders</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:12}}>
            {stakeholders.map((s,i)=>(
              <div key={i} style={{background:'var(--card)',border:'1px solid var(--border)',padding:'14px 18px'}}>
                <div style={{fontWeight:600,fontSize:13}}>{s.name}</div>
                {s.contact&&<div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>{s.contact}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {recruiters.length>0&&(
        <div style={{marginBottom:32}}>
          <div className="section-title" style={{marginBottom:12}}>Recruiters trabajando este cliente</div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            {recruiters.map(r=>(
              <div key={r.id} style={{background:'rgba(163,230,53,0.08)',border:'1px solid rgba(163,230,53,0.2)',padding:'6px 14px',fontSize:12,color:'var(--lime)'}}>{r.name}</div>
            ))}
          </div>
        </div>
      )}

      <PositionBlock title="Posiciones activas" list={active} color="var(--lime)"/>
      <PositionBlock title="On hold" list={onHold} color="#f59e0b"/>
      <PositionBlock title="Cerradas / Canceladas" list={closed} color="#555"/>
    </div>
  );
}

// ── RECRUITER VIEW ────────────────────────────────────────────────────────────
function RecruiterView({ user, users }) {
  const [positions,setPositions]=useState([]); const [clients,setClients]=useState([]); const [allPositions,setAllPositions]=useState([]); const [detail,setDetail]=useState(null); const [candModal,setCandModal]=useState(false);
  const load = useCallback(async()=>{
    const {data:pr}=await supabase.from('position_recruiters').select('position_id').eq('recruiter_id',user.id);
    const ids=(pr||[]).map(p=>p.position_id);
    if (ids.length) { const {data:pos}=await supabase.from('positions').select('*, clients(name,stakeholder)').in('id',ids).order('opened_at',{ascending:false}); setPositions(pos||[]); }
    const [{data:cl},{data:ap}]=await Promise.all([supabase.from('clients').select('*'),supabase.from('positions').select('*, clients(name)')]);
    setClients(cl||[]); setAllPositions(ap||[]);
  },[user.id]);
  useEffect(()=>{load();},[load]);
  if (detail) return <PositionDetail positionId={detail} user={user} users={users} onBack={()=>setDetail(null)} clients={clients} onRefresh={load}/>;
  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Mis posiciones</div><div className="page-sub">{positions.length} asignadas</div></div>
        <button className="btn-primary" onClick={()=>setCandModal(true)}>+ Agregar candidato</button>
      </div>
      <table className="data-table">
        <thead><tr><th>Cliente</th><th>Rol</th><th>Location</th><th>Estado</th></tr></thead>
        <tbody>{positions.map(p=>(
          <tr key={p.id} onClick={()=>setDetail(p.id)} style={{cursor:'pointer'}}>
            <td><span className="client-name">{p.clients?.name}</span></td>
            <td>{p.role}</td>
            <td style={{color:'var(--sub)',fontSize:11}}>{p.location}</td>
            <td><StatusBadge status={p.status}/></td>
          </tr>
        ))}</tbody>
      </table>
      {!positions.length&&<div className="empty-state">No tenés posiciones asignadas</div>}
      {candModal&&<CandidateModal onClose={()=>setCandModal(false)} onSave={()=>{setCandModal(false);load();}} positions={allPositions} currentUser={user}/>}
    </div>
  );
}

// ── ADMIN PAGE ────────────────────────────────────────────────────────────────
function AdminPage({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(null);
  const [showPass, setShowPass] = useState({});
  const [newModal, setNewModal] = useState(false);
  const [newForm, setNewForm] = useState({name:'',email:'',role:'recruiter',password:''});
  const [creating, setCreating] = useState(false);
  const [search, setSearch] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);

  const load = async () => {
    const {data} = await supabase.from('users').select('*').order('role').order('name');
    setUsers(data || []);
    setLoading(false);
  };
  useEffect(() => { if (currentUser?.role === 'owner') load(); }, []);

  // Guard AFTER all hooks
  if (currentUser?.role !== 'owner') return <div className="empty-state">Acceso restringido</div>;

  const startEdit = (u) => {
    setEditing(u.id);
    setEditForm({name: u.name, email: u.email, password: u.password || '', role: u.role});
  };

  const saveEdit = async (id) => {
    setSaving(true);
    await supabase.from('users').update(editForm).eq('id', id);
    setSaving(false);
    setSaved(id);
    setTimeout(() => setSaved(null), 2000);
    setEditing(null);
    load();
  };

  const deleteUser = async (u) => {
    await supabase.from('users').delete().eq('id', u.id);
    setConfirmDelete(null);
    load();
  };

  const createUser = async () => {
    if (!newForm.name || !newForm.email || !newForm.password) return;
    setCreating(true);
    await supabase.from('users').insert([newForm]);
    setCreating(false);
    setNewModal(false);
    setNewForm({name:'',email:'',role:'recruiter',password:''});
    load();
  };

  const togglePass = (id) => setShowPass(p => ({...p, [id]: !p[id]}));

  const roleColor = {owner:'var(--v)', recruiter:'var(--lime)', client:'#3b82f6'};
  const roleBg = {owner:'var(--v-light)', recruiter:'var(--lime-bg)', client:'#eff6ff'};

  const filtered = users.filter(u =>
    !search ||
    u.name?.toLowerCase().includes(search.toLowerCase()) ||
    u.email?.toLowerCase().includes(search.toLowerCase())
  );

  if (loading) return <div className="loading">Cargando...</div>;

  return (
    <div>
      {/* Header */}
      <div className="page-header">
        <div>
          <div className="page-title">Centro de mandos</div>
          <div className="page-sub">Gestión de accesos · {users.length} usuarios</div>
        </div>
        <button className="btn-primary" onClick={() => setNewModal(true)}>+ Nuevo usuario</button>
      </div>

      {/* Aviso */}
      <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,padding:'12px 16px',marginBottom:24,display:'flex',gap:10,alignItems:'center'}}>
        <span style={{fontSize:16}}>🔒</span>
        <span style={{fontSize:11,color:'var(--warning)'}}>Solo visible para owners. Las contraseñas se guardan como texto plano en Supabase — uso interno únicamente.</span>
      </div>

      {/* Search */}
      <div style={{marginBottom:20}}>
        <input className="filter-select" placeholder="Buscar usuario..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:280}}/>
      </div>

      {/* Tabla */}
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
        <table className="data-table" style={{marginBottom:0}}>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Contraseña</th>
              <th style={{width:160}}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(u => (
              <tr key={u.id} style={{background: saved===u.id ? '#f0fdf4' : ''}}>
                {editing === u.id ? (
                  <>
                    <td><input className="field-input" style={{marginBottom:0,padding:'6px 10px',fontSize:12}} value={editForm.name} onChange={e=>setEditForm(f=>({...f,name:e.target.value}))}/></td>
                    <td><input className="field-input" style={{marginBottom:0,padding:'6px 10px',fontSize:12}} value={editForm.email} onChange={e=>setEditForm(f=>({...f,email:e.target.value}))}/></td>
                    <td>
                      <select className="field-select" style={{marginBottom:0,padding:'6px 10px',fontSize:12}} value={editForm.role} onChange={e=>setEditForm(f=>({...f,role:e.target.value}))}>
                        <option value="owner">owner</option>
                        <option value="recruiter">recruiter</option>
                        <option value="client">client</option>
                      </select>
                    </td>
                    <td>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <input
                          className="field-input"
                          style={{marginBottom:0,padding:'6px 10px',fontSize:12,fontFamily:'monospace',flex:1}}
                          type={showPass[u.id] ? 'text' : 'password'}
                          value={editForm.password}
                          onChange={e=>setEditForm(f=>({...f,password:e.target.value}))}
                        />
                        <button className="btn-ghost" style={{padding:'5px 8px',fontSize:11,flexShrink:0}} onClick={()=>togglePass(u.id)}>
                          {showPass[u.id] ? '🙈' : '👁'}
                        </button>
                      </div>
                    </td>
                    <td>
                      <div style={{display:'flex',gap:6}}>
                        <button className="btn-primary" style={{padding:'5px 12px',fontSize:11}} onClick={()=>saveEdit(u.id)} disabled={saving}>
                          {saving ? '...' : '✓ Guardar'}
                        </button>
                        <button className="btn-ghost" style={{padding:'5px 10px',fontSize:11}} onClick={()=>setEditing(null)}>✕</button>
                      </div>
                    </td>
                  </>
                ) : (
                  <>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:roleBg[u.role]||'#f3f4f6',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:roleColor[u.role]||'#555',flexShrink:0}}>
                          {u.name?.charAt(0)?.toUpperCase()}
                        </div>
                        <span className="client-name">{u.name}</span>
                        {saved===u.id && <span style={{fontSize:10,color:'var(--lime)'}}>✓ guardado</span>}
                      </div>
                    </td>
                    <td style={{fontSize:12,color:'var(--sub)'}}>{u.email}</td>
                    <td>
                      <span style={{background:roleBg[u.role]||'#f3f4f6',color:roleColor[u.role]||'#555',padding:'2px 10px',borderRadius:4,fontSize:10,fontWeight:600,letterSpacing:1,textTransform:'uppercase'}}>
                        {u.role}
                      </span>
                    </td>
                    <td>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <span style={{fontFamily:'monospace',fontSize:12,color:'var(--text)',letterSpacing:1}}>
                          {showPass[u.id] ? (u.password || <span style={{color:'var(--muted)',fontStyle:'italic'}}>sin contraseña</span>) : '••••••••'}
                        </span>
                        <button className="btn-ghost" style={{padding:'3px 7px',fontSize:11}} onClick={()=>togglePass(u.id)}>
                          {showPass[u.id] ? '🙈' : '👁'}
                        </button>
                      </div>
                    </td>
                    <td>
                      <div style={{display:'flex',gap:6}}>
                        <button className="btn-ghost" style={{padding:'4px 12px',fontSize:11}} onClick={()=>startEdit(u)}>Editar</button>
                        <button className="btn-danger" style={{padding:'4px 10px',fontSize:11}} onClick={()=>setConfirmDelete(u)}>Borrar</button>
                      </div>
                    </td>
                  </>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Modal nuevo usuario */}
      {newModal && (
        <Modal title="Nuevo usuario" onClose={()=>setNewModal(false)}>
          <label className="field-label">Nombre</label>
          <input className="field-input" value={newForm.name} onChange={e=>setNewForm(f=>({...f,name:e.target.value}))} placeholder="Josefina Rodríguez"/>
          <label className="field-label">Email</label>
          <input className="field-input" value={newForm.email} onChange={e=>setNewForm(f=>({...f,email:e.target.value}))} placeholder="josefina@hwg.com" type="email"/>
          <label className="field-label">Rol</label>
          <select className="field-select" value={newForm.role} onChange={e=>setNewForm(f=>({...f,role:e.target.value}))}>
            <option value="owner">Owner</option>
            <option value="recruiter">Recruiter</option>
            <option value="client">Client</option>
          </select>
          <label className="field-label">Contraseña</label>
          <input className="field-input" value={newForm.password} onChange={e=>setNewForm(f=>({...f,password:e.target.value}))} placeholder="Elegí una contraseña" type="text"/>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={()=>setNewModal(false)}>Cancelar</button>
            <button className="btn-primary" onClick={createUser} disabled={creating}>{creating?'Creando...':'Crear usuario'}</button>
          </div>
        </Modal>
      )}

      {/* Confirm delete */}
      {confirmDelete && (
        <Modal title="Confirmar eliminación" onClose={()=>setConfirmDelete(null)}>
          <div style={{fontSize:13,color:'var(--text)',marginBottom:20}}>
            ¿Borrar a <strong>{confirmDelete.name}</strong>? Esta acción no se puede deshacer.
          </div>
          <div style={{background:'var(--danger-bg)',border:'1px solid #fecaca',borderRadius:6,padding:'10px 14px',fontSize:11,color:'var(--danger)',marginBottom:20}}>
            ⚠ Se eliminará el usuario pero no sus candidatos o aplicaciones asociadas.
          </div>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={()=>setConfirmDelete(null)}>Cancelar</button>
            <button className="btn-danger" style={{background:'var(--danger)',color:'#fff'}} onClick={()=>deleteUser(confirmDelete)}>Sí, borrar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null); const [page,setPage]=useState('dashboard'); const [users,setUsers]=useState([]);
  const loadUsers = async()=>{ const {data}=await supabase.from('users').select('*'); setUsers(data||[]); };
  useEffect(()=>{ if(user) loadUsers(); },[user]);
  if (!user) return <Login onLogin={u=>{setUser(u);setPage('dashboard');}}/>;
  const ownerNav=[{id:'dashboard',label:'Dashboard'},{id:'positions',label:'Posiciones'},{id:'clients',label:'Clientes'},{id:'candidates',label:'Candidatos'},{id:'users',label:'Equipo'},{id:'admin',label:'⚙ Admin'}];
  const recruiterNav=[{id:'positions',label:'Mis posiciones'},{id:'candidates',label:'Candidatos'}];
  const nav=user.role==='owner'?ownerNav:user.role==='recruiter'?recruiterNav:[];
  const renderPage=()=>{
    if (user.role==='client') return <ClientView user={user}/>;
    if (user.role==='recruiter') {
      if (page==='candidates') return <CandidatesPage user={user} users={users}/>;
      return <RecruiterView user={user} users={users}/>;
    }
    switch(page) {
      case 'dashboard': return <OwnerDashboard user={user} users={users}/>;
      case 'positions': return <PositionsPage user={user} users={users}/>;
      case 'clients': return <ClientsPage user={user} users={users}/>;
      case 'candidates': return <CandidatesPage user={user} users={users}/>;
      case 'users': return <UsersPage onRefresh={loadUsers}/>;
      case 'admin': return <AdminPage currentUser={user}/>;
      default: return <OwnerDashboard user={user} users={users}/>;
    }
  };
  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="sidebar-logo" onClick={()=>setPage('dashboard')}>
          <div className="sidebar-logo-hwg">HWG</div>
          <div className="sidebar-logo-sub">Talent Consultants</div>
        </div>
        <div className="sidebar-user">
          <div className="sidebar-user-name">{user.name}</div>
          <div className="sidebar-user-role">{user.role}</div>
        </div>
        {nav.map(item=>(
          <div key={item.id} className={`nav-item ${page===item.id?'active':''}`} onClick={()=>setPage(item.id)}>{item.label}</div>
        ))}
        <div className="sidebar-bottom">
          <button className="logout-btn" onClick={()=>setUser(null)}>— Cerrar sesión</button>
        </div>
      </aside>
      <main className="main-content">{renderPage()}</main>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
