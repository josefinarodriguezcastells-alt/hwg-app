<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWG ATS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f8; --sidebar: #ffffff; --card: #ffffff; --border: #e8e6f0;
  --v: #7c3aed; --v-light: #ede9fe; --v-mid: #a78bfa;
  --text: #1e1b2e; --muted: #9ca3af; --sub: #6b7280;
  --lime: #65a30d; --lime-bg: #f0fdf4;
  --danger: #dc2626; --danger-bg: #fef2f2;
  --warning: #d97706; --warning-bg: #fffbeb;
  --black: #1e1b2e;
}
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); position: relative; }
.login-wrap::before { content: ''; position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(124,58,237,0.06) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
.login-card { background: var(--card); border: 1px solid var(--border); padding: 48px; width: 380px; position: relative; border-radius: 12px; box-shadow: 0 4px 24px rgba(124,58,237,0.08); }
.login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--v); border-radius: 12px 12px 0 0; }
.logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--v); margin-bottom: 2px; text-align: center; }
.logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 36px; text-align: center; }
.field-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); margin-bottom: 8px; display: block; }
.field-input { width: 100%; background: #faf9fc; border: 1px solid var(--border); color: var(--text); padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; margin-bottom: 20px; border-radius: 6px; }
.field-input:focus { border-color: var(--v); background: #fff; }
.field-select { width: 100%; background: #faf9fc; border: 1px solid var(--border); color: var(--text); padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; margin-bottom: 20px; cursor: pointer; border-radius: 6px; }
.field-select:focus { border-color: var(--v); }
.field-textarea { width: 100%; background: #faf9fc; border: 1px solid var(--border); color: var(--text); padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; margin-bottom: 20px; resize: vertical; min-height: 80px; border-radius: 6px; }
.field-textarea:focus { border-color: var(--v); }
.btn-primary { background: var(--v); color: #fff; border: none; padding: 12px 20px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; border-radius: 6px; }
.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { background: #fff; color: var(--sub); border: 1px solid var(--border); padding: 10px 18px; font-family: 'Inter', sans-serif; font-size: 11px; cursor: pointer; transition: all 0.2s; border-radius: 6px; }
.btn-ghost:hover { border-color: var(--v-mid); color: var(--v); background: var(--v-light); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid #fecaca; padding: 8px 16px; font-family: 'Inter', sans-serif; font-size: 11px; cursor: pointer; transition: all 0.2s; border-radius: 6px; }
.btn-danger:hover { background: var(--danger-bg); }
.error-msg { color: var(--danger); font-size: 11px; margin-bottom: 16px; background: var(--danger-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid #fecaca; }
.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 0; flex-shrink: 0; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; box-shadow: 2px 0 8px rgba(124,58,237,0.04); }
.sidebar-logo { padding: 0 24px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; cursor: pointer; text-align: center; }
.sidebar-logo:hover { opacity: 0.85; }
.sidebar-logo-hwg { font-size: 26px; font-weight: 800; color: var(--v); letter-spacing: -1px; line-height: 1; }
.sidebar-logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
.sidebar-user { padding: 0 24px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.sidebar-user-name { font-weight: 700; font-size: 13px; color: var(--text); }
.sidebar-user-role { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.nav-item { padding: 10px 24px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sub); cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; }
.nav-item:hover { color: var(--v); background: var(--v-light); }
.nav-item.active { color: var(--v); border-left-color: var(--v); background: var(--v-light); font-weight: 600; }
.sidebar-bottom { margin-top: auto; padding: 20px 24px 0; border-top: 1px solid var(--border); }
.logout-btn { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: color 0.15s; background: none; border: none; font-family: 'Inter', sans-serif; }
.logout-btn:hover { color: var(--danger); }
.main-content { margin-left: 220px; flex: 1; padding: 40px; min-height: 100vh; background: var(--bg); }
.page-title { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 4px; letter-spacing: -0.5px; }
.page-sub { font-size: 11px; color: var(--sub); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
.stat-card { background: var(--card); border: 1px solid var(--border); padding: 20px 24px; position: relative; overflow: hidden; border-radius: 8px; }
.stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--v); opacity: 0.15; }
.stat-num { font-size: 36px; font-weight: 800; color: var(--v); line-height: 1; }
.stat-label { font-size: 10px; color: var(--sub); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); margin-bottom: 16px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 40px; }
.data-table th { text-align: left; padding: 10px 16px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; background: #faf9fc; }
.data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--sub); vertical-align: middle; }
.data-table tr:hover td { background: var(--v-light); cursor: pointer; }
.client-name { font-weight: 700; font-size: 13px; color: var(--text); }
.badge { display: inline-block; padding: 3px 10px; font-size: 10px; letter-spacing: 1px; font-weight: 500; }
.badge-active { background: var(--lime-bg); color: var(--lime); border: 1px solid #bbf7d0; }
.badge-on_hold { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
.badge-closed { background: #f9fafb; color: var(--muted); border: 1px solid var(--border); }
.badge-cancelled { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
.badge-inactive { background: #f9fafb; color: var(--muted); border: 1px solid var(--border); }
.stage-pill { display: inline-block; padding: 3px 10px; font-size: 10px; border-radius: 2px; }
.positions-grid { display: grid; gap: 20px; }
.position-card { background: var(--card); border: 1px solid var(--border); padding: 24px; transition: border-color 0.2s; cursor: pointer; border-radius: 8px; }
.position-card:hover { border-color: var(--v-mid); }
.position-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.position-title { font-size: 18px; font-weight: 700; color: #f0f0f0; }
.candidates-list { display: flex; flex-direction: column; gap: 8px; }
.candidate-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
.candidate-name { font-size: 13px; color: #e0e0e0; font-weight: 500; }
.candidate-info { font-size: 11px; color: var(--muted); margin-top: 2px; }
.empty-state { padding: 32px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border: 1px dashed var(--border); border-radius: 8px; background: #faf9fc; }
.alert-card { background: var(--warning-bg); border: 1px solid #fde68a; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
.alert-card.red { background: var(--danger-bg); border-color: #fecaca; }
.alert-text { font-size: 12px; color: var(--warning); }
.alert-text.red { color: var(--danger); }
.modal-overlay { position: fixed; inset: 0; background: rgba(30,27,46,0.4); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.modal { background: var(--card); border: 1px solid var(--border); padding: 36px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; position: relative; border-radius: 12px; box-shadow: 0 8px 32px rgba(124,58,237,0.12); }
.modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--v); border-radius: 12px 12px 0 0; }
.modal-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; color: var(--text); }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { margin-bottom: 4px; }
.filter-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
.filter-select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; font-family: 'Inter', sans-serif; font-size: 11px; outline: none; cursor: pointer; border-radius: 6px; }
.filter-select:focus { border-color: var(--v); }
.detail-header { background: var(--card); border: 1px solid var(--border); padding: 28px; margin-bottom: 24px; border-radius: 8px; }
.detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
.detail-item label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.detail-item span { font-size: 13px; color: #e0e0e0; }
.back-btn { font-size: 11px; color: var(--sub); cursor: pointer; letter-spacing: 1px; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px; }
.back-btn:hover { color: var(--v); }
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--v-mid); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
.semaphore-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot-green { background: var(--lime); } .dot-yellow { background: var(--warning); } .dot-red { background: var(--danger); }
.tab-row { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tab { padding: 10px 20px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab.active { color: var(--v); border-bottom-color: var(--v); }
.tab:hover { color: #f0f0f0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const SUPABASE_URL = 'https://sdoxrlxfwldhnqvuioty.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkb3hybHhmd2xkaG5xdnVpb3R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MDQ3MDYsImV4cCI6MjA4ODk4MDcwNn0.L3wCZv8g0HAOmxctU5wQnnzBNi2IKxoeANyL9-Yp6Qo';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STATUSES = ['sourced','entrevista_hwg','entrevista_cliente_fit','entrevista_cliente_tech','entrevista_cliente_cultura','offer','preocupacional','psicotecnico','hired','rechazado_salario','rechazado_tech','rechazado_location','on_hold'];
const STATUS_COLORS = { sourced:'#3b82f6', entrevista_hwg:'#8b5cf6', entrevista_cliente_fit:'#a78bfa', entrevista_cliente_tech:'#f59e0b', entrevista_cliente_cultura:'#fb923c', offer:'#a3e635', preocupacional:'#4ade80', psicotecnico:'#22c55e', hired:'#16a34a', rechazado_salario:'#ef4444', rechazado_tech:'#dc2626', rechazado_location:'#b91c1c', on_hold:'#6b7280' };

function StagePill({ status }) {
  const c = STATUS_COLORS[status]||'#555';
  return <span className="stage-pill" style={{background:`${c}22`,color:c,fontSize:10}}>{status?.replace(/_/g,' ')}</span>;
}
function StatusBadge({ status }) {
  return <span className={`badge badge-${status}`}>{status?.replace(/_/g,' ')}</span>;
}
function HoursAgo({ ts }) {
  if (!ts) return <span style={{color:'var(--sub)'}}>—</span>;
  const h = Math.floor((Date.now()-new Date(ts))/3600000);
  const c = h>=96?'#ef4444':h>=72?'#f59e0b':'#a3e635';
  const d = h>=96?'dot-red':h>=72?'dot-yellow':'dot-green';
  return <span><span className={`semaphore-dot ${d}`}></span><span style={{color:c,fontSize:11}}>{h}h sin movimiento</span></span>;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [email,setEmail]=useState(''); const [pass,setPass]=useState(''); const [error,setError]=useState(''); const [loading,setLoading]=useState(false);
  const handleLogin = async () => {
    setLoading(true); setError('');
    const {data,error:err} = await supabase.from('users').select('*').eq('email',email).eq('password',pass).single();
    if (err||!data) { setError('Credenciales incorrectas'); setLoading(false); return; }
    onLogin(data); setLoading(false);
  };
  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="logo">HWG</div>
        <div className="logo-sub">Talent Consultants</div>
        <label className="field-label">Email</label>
        <input className="field-input" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" type="email"/>
        <label className="field-label">Contraseña</label>
        <input className="field-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        {error && <div className="error-msg">{error}</div>}
        <button className="btn-primary" style={{width:'100%'}} onClick={handleLogin} disabled={loading}>{loading?'Ingresando...':'Ingresar'}</button>
      </div>
    </div>
  );
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function Modal({ title, onClose, children }) {
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">{title}</div>
        {children}
      </div>
    </div>
  );
}

// ── CLIENT MODAL ──────────────────────────────────────────────────────────────
function ClientModal({ onClose, onSave, initial }) {
  const parseStakeholders = (raw) => {
    if (!raw) return [{name:'',contact:''}];
    try { const p=JSON.parse(raw); return Array.isArray(p)?p:[{name:raw,contact:''}]; }
    catch(e) { return [{name:raw,contact:''}]; }
  };
  const [form,setForm]=useState(initial||{name:'',status:'active',notes:''});
  const [stakeholders,setStakeholders]=useState(parseStakeholders(initial?.stakeholder));
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setSH=(i,k,v)=>setStakeholders(s=>s.map((x,idx)=>idx===i?{...x,[k]:v}:x));
  const addSH=()=>setStakeholders(s=>[...s,{name:'',contact:''}]);
  const removeSH=(i)=>setStakeholders(s=>s.filter((_,idx)=>idx!==i));
  const save = async () => {
    if (!form.name) return;
    const payload={...form, stakeholder:JSON.stringify(stakeholders.filter(s=>s.name))};
    if (initial?.id) await supabase.from('clients').update(payload).eq('id',initial.id);
    else await supabase.from('clients').insert([payload]);
    onSave();
  };
  return (
    <Modal title={initial?'Editar cliente':'Nuevo cliente'} onClose={onClose}>
      <label className="field-label">Empresa</label>
      <input className="field-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Globant"/>
      <label className="field-label" style={{marginBottom:12}}>Stakeholders</label>
      {stakeholders.map((s,i)=>(
        <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,marginBottom:10,alignItems:'center'}}>
          <input className="field-input" style={{marginBottom:0}} value={s.name} onChange={e=>setSH(i,'name',e.target.value)} placeholder="Nombre"/>
          <input className="field-input" style={{marginBottom:0}} value={s.contact} onChange={e=>setSH(i,'contact',e.target.value)} placeholder="Email / Tel"/>
          {stakeholders.length>1&&<button className="btn-danger" style={{padding:'8px 10px',fontSize:12}} onClick={()=>removeSH(i)}>✕</button>}
        </div>
      ))}
      <button className="btn-ghost" style={{fontSize:10,padding:'6px 12px',marginBottom:20}} onClick={addSH}>+ Agregar stakeholder</button>
      <label className="field-label">Notas del cliente</label>
      <textarea className="field-textarea" value={form.notes||''} onChange={e=>set('notes',e.target.value)} placeholder="Contexto, industria, fee acordado..."/>
      <label className="field-label">Estado</label>
      <select className="field-select" value={form.status} onChange={e=>set('status',e.target.value)}>
        <option value="active">Activo</option><option value="inactive">Inactivo</option>
      </select>
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn-primary" onClick={save}>Guardar</button>
      </div>
    </Modal>
  );
}

// ── POSITION MODAL ────────────────────────────────────────────────────────────
function PositionModal({ onClose, onSave, initial, clients, users }) {
  const [form,setForm]=useState(initial ? {
    client_id: initial.client_id||'',
    role: initial.role||'',
    location: initial.location||'',
    salary_band: initial.salary_band||'',
    jd: initial.jd||'',
    vacancies: initial.vacancies||1,
    status: initial.status||'active',
    notes: initial.notes||''
  } : {client_id:'',role:'',location:'',salary_band:'',jd:'',vacancies:1,status:'active',notes:''});
  const [recruiters,setRecruiters]=useState([]);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  useEffect(()=>{
    if (initial?.id) supabase.from('position_recruiters').select('recruiter_id').eq('position_id',initial.id).then(({data})=>setRecruiters(data?.map(r=>r.recruiter_id)||[]));
  },[]);
  const save = async () => {
    if (!form.client_id||!form.role) return;
    let posId = initial?.id;
    if (posId) { await supabase.from('positions').update(form).eq('id',posId); }
    else { const {data}=await supabase.from('positions').insert([form]).select().single(); posId=data?.id; }
    if (posId) {
      await supabase.from('position_recruiters').delete().eq('position_id',posId);
      if (recruiters.length) await supabase.from('position_recruiters').insert(recruiters.map(r=>({position_id:posId,recruiter_id:r})));
    }
    onSave();
  };
  const recList = users.filter(u=>u.role==='recruiter');
  return (
    <Modal title={initial?'Editar posición':'Nueva posición'} onClose={onClose}>
      <div className="form-row">
        <div className="form-group">
          <label className="field-label">Cliente</label>
          <select className="field-select" value={form.client_id} onChange={e=>set('client_id',e.target.value)}>
            <option value="">Seleccionar...</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <div className="form-group">
          <label className="field-label">Rol</label>
          <input className="field-input" value={form.role} onChange={e=>set('role',e.target.value)} placeholder="Senior Backend Engineer"/>
        </div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="field-label">Location</label>
          <input className="field-input" value={form.location} onChange={e=>set('location',e.target.value)} placeholder="Argentina / Remoto"/>
        </div>
        <div className="form-group">
          <label className="field-label">Salary Band</label>
          <input className="field-input" value={form.salary_band} onChange={e=>set('salary_band',e.target.value)} placeholder="$3.000 USD"/>
        </div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="field-label">Vacantes</label>
          <input className="field-input" type="number" min="1" value={form.vacancies} onChange={e=>set('vacancies',parseInt(e.target.value))}/>
        </div>
        <div className="form-group">
          <label className="field-label">Estado</label>
          <select className="field-select" value={form.status} onChange={e=>set('status',e.target.value)}>
            <option value="active">Active</option><option value="on_hold">On Hold</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <label className="field-label">JD / Descripción</label>
      <textarea className="field-textarea" value={form.jd} onChange={e=>set('jd',e.target.value)} placeholder="Job description..."/>
      <label className="field-label">Recruiters (Ctrl/Cmd para varios)</label>
      <select multiple className="field-select" style={{height:100,marginBottom:4}} value={recruiters} onChange={e=>setRecruiters(Array.from(e.target.selectedOptions,o=>o.value))}>
        {recList.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
      </select>
      <div style={{fontSize:10,color:'var(--muted)',marginBottom:20}}>Mantené Ctrl/Cmd para seleccionar varios</div>
      <label className="field-label">Notas</label>

      <div className="modal-actions">
        <button className="btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn-primary" onClick={save}>Guardar</button>
      </div>
    </Modal>
  );
}

// ── CANDIDATE MODAL ───────────────────────────────────────────────────────────
function CandidateModal({ onClose, onSave, initial, positions, currentUser }) {
  const [form,setForm]=useState(initial||{name:'',linkedin_url:'',email:'',phone:''});
  const [positionId,setPositionId]=useState(''); const [status,setStatus]=useState('sourced');
  const [notes,setNotes]=useState(''); const [cvFile,setCvFile]=useState(null);
  const [loading,setLoading]=useState(false); const [dupWarning,setDupWarning]=useState(null);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const checkDup = async (url) => {
    if (!url || url.length < 10) return;
    try {
      const {data}=await supabase.from('candidates').select('*').eq('linkedin_url',url).single();
      setDupWarning(data||null);
    } catch(e) { setDupWarning(null); }
  };
  const save = async () => {
    setLoading(true);
    let cvUrl=form.cv_url;
    if (cvFile) {
      const ext=cvFile.name.split('.').pop();
      const path=`cvs/${Date.now()}.${ext}`;
      const {error: upErr} = await supabase.storage.from('candidates').upload(path,cvFile);
      if (upErr) { console.error('CV upload error:', upErr); alert('Error subiendo CV: ' + upErr.message); setLoading(false); return; }
      const {data:urlData}=supabase.storage.from('candidates').getPublicUrl(path);
      cvUrl=urlData.publicUrl;
    }
    let candId=dupWarning?.id||initial?.id;
    if (!candId) { const {data}=await supabase.from('candidates').insert([{...form,cv_url:cvUrl}]).select().single(); candId=data?.id; }
    else if (cvUrl && cvUrl !== form.cv_url) { await supabase.from('candidates').update({cv_url:cvUrl}).eq('id',candId); }
    if (candId&&positionId) {
      const {data:app}=await supabase.from('applications').insert([{candidate_id:candId,position_id:positionId,recruiter_id:currentUser.id,status,notes}]).select().single();
      if (app) await supabase.from('status_history').insert([{application_id:app.id,old_status:null,new_status:status,changed_by:currentUser.id}]);
    }
    setLoading(false); onSave();
  };
  return (
    <Modal title="Agregar candidato" onClose={onClose}>
      {dupWarning&&<div style={{background:'var(--warning-bg)',border:'1px solid #3a2500',padding:'12px 16px',marginBottom:20,fontSize:11,color:'var(--warning)'}}>⚠️ Ya existe: <strong>{dupWarning.name}</strong> — se agrega a la posición sin duplicar.</div>}
      <label className="field-label">Nombre</label>
      <input className="field-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Juan Pérez"/>
      <label className="field-label">LinkedIn URL</label>
      <input className="field-input" value={form.linkedin_url} onChange={e=>{set('linkedin_url',e.target.value);checkDup(e.target.value);}} placeholder="linkedin.com/in/juanperez"/>
      <div className="form-row">
        <div className="form-group"><label className="field-label">Email</label><input className="field-input" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="juan@email.com"/></div>
        <div className="form-group"><label className="field-label">Teléfono</label><input className="field-input" value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="+54 11 ..."/></div>
      </div>
      <label className="field-label">CV (PDF)</label>
      <input type="file" accept=".pdf,.doc,.docx" onChange={e=>setCvFile(e.target.files[0])} style={{marginBottom:20,fontSize:11,color:'var(--muted)',width:'100%'}}/>
      <label className="field-label">Posición</label>
      <select className="field-select" value={positionId} onChange={e=>setPositionId(e.target.value)}>
        <option value="">Seleccionar posición...</option>
        {(positions||[]).filter(p=>p.status==='active').map(p=><option key={p.id} value={p.id}>{p.clients?.name} — {p.role}</option>)}
      </select>
      <label className="field-label">Estado inicial</label>
      <select className="field-select" value={status} onChange={e=>setStatus(e.target.value)}>
        {STATUSES.map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
      </select>
      <label className="field-label">Notas</label>
      <textarea className="field-textarea" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Contexto del candidato..."/>
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn-primary" onClick={save} disabled={loading}>{loading?'Guardando...':'Guardar'}</button>
      </div>
    </Modal>
  );
}

// ── CANDIDATE PROFILE ─────────────────────────────────────────────────────────
function DocsNotesSection({ candData, setCandData, onUpdate }) {
  const [docs, setDocs] = useState([]);
  const [uploading, setUploading] = useState(null);
  const [notes, setNotes] = useState(candData.notes || '');
  const [savingNotes, setSavingNotes] = useState(false);
  const [notesSaved, setNotesSaved] = useState(false);

  const loadDocs = useCallback(async () => {
    if (!candData.id) return;
    const {data, error} = await supabase.from('candidate_documents').select('*').eq('candidate_id', candData.id).order('created_at', {ascending: false});
    if (error) console.error('loadDocs error:', error.message);
    setDocs(data || []);
  }, [candData.id]);

  useEffect(() => { loadDocs(); }, [loadDocs]);

  const uploadDoc = async (file, type) => {
    setUploading(type);
    try {
      const ext = file.name.split('.').pop();
      // Path: candidateId/type_timestamp.ext  — no leading slash
      const path = `${candData.id}/${type}_${Date.now()}.${ext}`;

      const {error: upErr} = await supabase.storage
        .from('candidates')
        .upload(path, file, {upsert: true, contentType: file.type || 'application/octet-stream'});

      if (upErr) {
        console.error('Storage upload error:', upErr);
        alert(`Error subiendo archivo (${upErr.message}). Verificá que el bucket tenga políticas de escritura habilitadas en Supabase.`);
        setUploading(null);
        return;
      }

      const {data: urlData} = supabase.storage.from('candidates').getPublicUrl(path);
      const url = urlData.publicUrl;

      if (type === 'cv') {
        const {error: dbErr} = await supabase.from('candidates').update({cv_url: url}).eq('id', candData.id);
        if (dbErr) { alert('Error guardando URL en DB: ' + dbErr.message); setUploading(null); return; }
        setCandData(c => ({...c, cv_url: url}));
      } else {
        const {error: docErr} = await supabase.from('candidate_documents').insert([{
          candidate_id: candData.id,
          type,
          name: file.name,
          url
        }]);
        if (docErr) { alert('Error guardando documento: ' + docErr.message); setUploading(null); return; }
        loadDocs();
      }

      if (onUpdate) onUpdate();
    } catch(err) {
      console.error('Upload exception:', err);
      alert('Error inesperado: ' + err.message);
    }
    setUploading(null);
  };

  const deleteDoc = async (doc) => {
    if (!confirm(`¿Eliminar "${doc.name}"?`)) return;
    await supabase.from('candidate_documents').delete().eq('id', doc.id);
    loadDocs();
  };

  const deleteCV = async () => {
    if (!confirm('¿Eliminar el CV?')) return;
    await supabase.from('candidates').update({cv_url: null}).eq('id', candData.id);
    setCandData(c => ({...c, cv_url: null}));
    if (onUpdate) onUpdate();
  };

  const saveNotes = async () => {
    setSavingNotes(true);
    await supabase.from('candidates').update({notes}).eq('id', candData.id);
    setCandData(c => ({...c, notes}));
    setSavingNotes(false);
    setNotesSaved(true);
    setTimeout(() => setNotesSaved(false), 2000);
  };

  const DOC_TYPES = [
    {type:'interview_notes', label:'Notas de entrevista', icon:'📝', accept:'.pdf,.doc,.docx,.txt'},
    {type:'cover_letter', label:'Carta de presentación', icon:'✉️', accept:'.pdf,.doc,.docx'},
    {type:'certificate', label:'Certificado / Portfolio', icon:'🏅', accept:'.pdf,.doc,.docx,.zip,.png,.jpg'},
  ];

  return (
    <div style={{marginBottom:24}}>
      {/* ── LinkedIn ── */}
      {candData.linkedin_url && (
        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:16,marginBottom:12,display:'flex',alignItems:'center',gap:12}}>
          <a href={`https://${candData.linkedin_url.replace('https://','')}`} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,background:'#0a66c2',color:'#fff',padding:'8px 16px',textDecoration:'none',fontSize:12,fontWeight:600,borderRadius:6}}>
            <span>in</span> Ver perfil en LinkedIn ↗
          </a>
          <span style={{fontSize:11,color:'var(--muted)'}}>{candData.linkedin_url}</span>
        </div>
      )}

      {/* ── CV ── */}
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:20,marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom: candData.cv_url ? 16 : 0}}>
          <div style={{fontWeight:600,fontSize:13,color:'var(--text)'}}>📄 Curriculum Vitae</div>
          <div style={{display:'flex',gap:8}}>
            {candData.cv_url && <a href={candData.cv_url} target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{textDecoration:'none',fontSize:11,padding:'6px 12px'}}>Ver ↗</a>}
            <label className="btn-ghost" style={{cursor:'pointer',fontSize:11,padding:'6px 12px'}}>
              {uploading==='cv' ? 'Subiendo...' : candData.cv_url ? 'Reemplazar' : '+ Subir CV'}
              <input type="file" accept=".pdf,.doc,.docx" style={{display:'none'}} onChange={e=>{if(e.target.files[0]) uploadDoc(e.target.files[0],'cv');}}/>
            </label>
            {candData.cv_url && <button className="btn-danger" style={{fontSize:11,padding:'6px 12px'}} onClick={deleteCV}>Eliminar</button>}
          </div>
        </div>
        {candData.cv_url && (
          candData.cv_url.toLowerCase().includes('.pdf')
            ? <iframe src={candData.cv_url} style={{width:'100%',height:400,border:'none',borderRadius:4,background:'#fff'}} title="CV"/>
            : <div style={{fontSize:11,color:'var(--muted)'}}>Archivo Word — <a href={candData.cv_url} target="_blank" rel="noopener noreferrer" style={{color:'var(--v)'}}>descargar ↗</a></div>
        )}
        {!candData.cv_url && <div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>Sin CV cargado</div>}
      </div>

      {/* ── Otros documentos ── */}
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:20,marginBottom:12}}>
        <div style={{fontWeight:600,fontSize:13,color:'var(--text)',marginBottom:14}}>📁 Documentos adicionales</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom: docs.length>0 ? 16 : 0}}>
          {DOC_TYPES.map(dt=>(
            <label key={dt.type} className="btn-ghost" style={{cursor:'pointer',fontSize:11,padding:'6px 12px'}}>
              {uploading===dt.type ? 'Subiendo...' : `+ ${dt.label}`}
              <input type="file" accept={dt.accept} style={{display:'none'}} onChange={e=>{if(e.target.files[0]) uploadDoc(e.target.files[0],dt.type);}}/>
            </label>
          ))}
        </div>
        {docs.length===0 && <div style={{fontSize:11,color:'var(--muted)'}}>Sin documentos cargados</div>}
        {docs.map(doc=>(
          <div key={doc.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:12,color:'var(--text)'}}>
              <span style={{background:'var(--v-light)',color:'var(--v)',fontSize:9,padding:'2px 6px',borderRadius:3,marginRight:8,textTransform:'uppercase',letterSpacing:1}}>{doc.type.replace(/_/g,' ')}</span>
              {doc.name}
            </div>
            <div style={{display:'flex',gap:6}}>
              <a href={doc.url} target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{textDecoration:'none',fontSize:10,padding:'4px 8px'}}>Ver ↗</a>
              <button className="btn-danger" style={{fontSize:10,padding:'4px 8px'}} onClick={()=>deleteDoc(doc)}>Eliminar</button>
            </div>
          </div>
        ))}
      </div>

      {/* ── Notas generales ── */}
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontWeight:600,fontSize:13,color:'var(--text)'}}>🗒 Notas del candidato</div>
          <button className="btn-primary" style={{fontSize:11,padding:'6px 14px'}} onClick={saveNotes} disabled={savingNotes}>
            {savingNotes ? 'Guardando...' : notesSaved ? '✓ Guardado' : 'Guardar'}
          </button>
        </div>
        <textarea className="field-textarea" style={{marginBottom:0,minHeight:100}} 
          placeholder="Notas generales sobre el candidato (no asociadas a una posición específica)..."
          value={notes} onChange={e=>setNotes(e.target.value)}/>
      </div>
    </div>
  );
}

function CandidateProfile({ candidate, onBack, currentUser, allPositions, onUpdate }) {
  const [apps,setApps]=useState([]); const [loading,setLoading]=useState(true);
  const [addModal,setAddModal]=useState(false); const [editForm,setEditForm]=useState(null);
  const [note,setNote]=useState(''); const [saving,setSaving]=useState(false);
  const [editCand,setEditCand]=useState(false);
  const [candForm,setCandForm]=useState({name:candidate.name,email:candidate.email||'',phone:candidate.phone||'',linkedin_url:candidate.linkedin_url||''});
  const [candData,setCandData]=useState(candidate);
  const [presentarModal,setPresentarModal]=useState(null);
  const saveCand = async () => {
    await supabase.from('candidates').update(candForm).eq('id',candData.id);
    setCandData(c=>({...c,...candForm})); setEditCand(false); if(onUpdate) onUpdate();
  };

  const load = useCallback(async()=>{
    const {data}=await supabase.from('applications').select('*, positions(role,status,jd,clients(name)), users(name)').eq('candidate_id',candidate.id).order('last_updated',{ascending:false});
    setApps(data||[]); setLoading(false);
  },[candidate.id]);

  useEffect(()=>{ load(); },[load]);

  const updateStatus = async (appId, newStatus, oldStatus) => {
    await supabase.from('applications').update({status:newStatus,last_updated:new Date().toISOString()}).eq('id',appId);
    await supabase.from('status_history').insert([{application_id:appId,old_status:oldStatus,new_status:newStatus,changed_by:currentUser.id}]);
    if (newStatus==='hired' && oldStatus!=='hired') {
      const app = apps.find(a=>a.id===appId);
      if (app?.position_id) {
        const {data:pos}=await supabase.from('positions').select('vacancies,status').eq('id',app.position_id).single();
        if (pos) {
          const newV=(pos.vacancies||1)-1;
          await supabase.from('positions').update(newV<=0?{vacancies:0,status:'closed'}:{vacancies:newV}).eq('id',app.position_id);
        }
      }
    }
    if (oldStatus==='hired' && newStatus!=='hired') {
      const app = apps.find(a=>a.id===appId);
      if (app?.position_id) {
        const {data:pos}=await supabase.from('positions').select('vacancies').eq('id',app.position_id).single();
        if (pos) await supabase.from('positions').update({vacancies:(pos.vacancies||0)+1,status:'active'}).eq('id',app.position_id);
      }
    }
    load();
  };

  const addToPosition = async (positionId, status, notes) => {
    const existing = await supabase.from('applications').select('id').eq('candidate_id',candidate.id).eq('position_id',positionId).single();
    if (existing.data) { alert('Ya está en esa posición'); return; }
    const {data:app}=await supabase.from('applications').insert([{candidate_id:candidate.id,position_id:positionId,recruiter_id:currentUser.id,status,notes}]).select().single();
    if (app) await supabase.from('status_history').insert([{application_id:app.id,old_status:null,new_status:status,changed_by:currentUser.id}]);
    setAddModal(false); load();
  };

  const saveNote = async (appId) => {
    if (!note.trim()) return;
    setSaving(true);
    await supabase.from('applications').update({notes:note,last_updated:new Date().toISOString()}).eq('id',appId);
    setNote(''); setEditForm(null); setSaving(false); load();
  };

  if (loading) return <div className="loading">Cargando...</div>;

  return (
    <div>
      <div className="back-btn" onClick={onBack}>← Volver</div>
      <div className="detail-header">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div className="page-title">{candData.name}</div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:4,letterSpacing:1}}>
              {candData.email&&<span>{candData.email} · </span>}
              {candData.phone&&<span>{candData.phone} · </span>}
              {candData.linkedin_url&&<a href={`https://${candData.linkedin_url.replace('https://','')}`} target="_blank" rel="noopener noreferrer" style={{color:'#3b82f6',textDecoration:'none'}}>LinkedIn ↗</a>}
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-ghost" onClick={()=>setEditCand(true)}>Editar</button>
            <button className="btn-primary" onClick={()=>setAddModal(true)}>+ Agregar a posición</button>
          </div>
        </div>
      </div>

      {editCand&&(
        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:24,marginBottom:24}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:16,letterSpacing:1,color:'var(--text)'}}>Editar candidato</div>
          <div className="form-row">
            <div><label className="field-label">Nombre</label><input className="field-input" value={candForm.name} onChange={e=>setCandForm(f=>({...f,name:e.target.value}))}/></div>
            <div><label className="field-label">Email</label><input className="field-input" value={candForm.email} onChange={e=>setCandForm(f=>({...f,email:e.target.value}))}/></div>
          </div>
          <div className="form-row">
            <div><label className="field-label">Teléfono</label><input className="field-input" value={candForm.phone} onChange={e=>setCandForm(f=>({...f,phone:e.target.value}))}/></div>
            <div><label className="field-label">LinkedIn URL</label><input className="field-input" value={candForm.linkedin_url} onChange={e=>setCandForm(f=>({...f,linkedin_url:e.target.value}))}/></div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-primary" onClick={saveCand}>Guardar</button>
            <button className="btn-ghost" onClick={()=>setEditCand(false)}>Cancelar</button>
          </div>
        </div>
      )}

      <DocsNotesSection candData={candData} setCandData={setCandData} onUpdate={onUpdate} />

      <div className="section-title" style={{marginBottom:16}}>Posiciones ({apps.length})</div>
      {apps.length===0
        ? <div className="empty-state">Sin posiciones asignadas</div>
        : <div className="candidates-list">
            {apps.map(a=>(
              <div key={a.id} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:6,padding:'16px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>{a.positions?.clients?.name} — {a.positions?.role}</div>
                    <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{a.users?.name} · <HoursAgo ts={a.last_updated}/></div>
                    {a.notes&&<div style={{fontSize:11,color:'var(--sub)',marginTop:6,fontStyle:'italic'}}>"{a.notes}"</div>}
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <select style={{background:'var(--card)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',fontFamily:'Inter',fontSize:11,outline:'none',cursor:'pointer',borderRadius:4}}
                      value={a.status} onChange={e=>updateStatus(a.id,e.target.value,a.status)}>
                      {STATUSES.map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
                    </select>
                    <button className="btn-ghost" style={{padding:'5px 10px',fontSize:10}} onClick={()=>{setEditForm(a.id);setNote(a.notes||'');}}>Nota</button>
                    <button className="btn-ghost" style={{padding:'5px 10px',fontSize:10,color:'var(--v)',borderColor:'var(--v)'}} onClick={()=>setPresentarModal({app:a,position:a.positions,candidate:candData})}>Presentar ↗</button>
                  </div>
                </div>
                {editForm===a.id&&(
                  <div style={{marginTop:12}}>
                    <textarea className="field-textarea" style={{marginBottom:8}} value={note} onChange={e=>setNote(e.target.value)} placeholder="Agregar nota..."/>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn-primary" style={{padding:'8px 16px'}} onClick={()=>saveNote(a.id)} disabled={saving}>Guardar</button>
                      <button className="btn-ghost" style={{padding:'8px 16px'}} onClick={()=>setEditForm(null)}>Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
      }

      {addModal&&(
        <AddToPositionModal
          onClose={()=>setAddModal(false)}
          onSave={addToPosition}
          positions={allPositions}
          existingPositionIds={apps.map(a=>a.position_id)}
        />
      )}
      {presentarModal&&(
        <PresentarModal
          app={presentarModal.app}
          position={presentarModal.position}
          candidate={presentarModal.candidate}
          cvUrl={candData.cv_url}
          onClose={()=>setPresentarModal(null)}
        />
      )}
    </div>
  );
}

  const [docsLoading, setDocsLoading] = useState(true);

  const [candEdit, setCandEdit] = useState({
    name: candidate.name || '',
    location: candidate.location || '',
    phone: candidate.phone || '',
    email: candidate.email || '',
  });

  const [presEdit, setPresEdit] = useState({
    salary: '',
    availability: '',
  });

  const [recruiterNotes, setRecruiterNotes] = useState(app.notes || '');
  const [notesFileLoading, setNotesFileLoading] = useState(false);

  const jd = position?.jd || '';
  const posLabel = `${position?.role || ''} · ${position?.clients?.name || ''}`;
  const today = new Date().toLocaleDateString('es-AR', {day:'2-digit', month:'long', year:'numeric'});

  // Load candidate docs on open
  useEffect(() => {
    (async () => {
      if (!candidate.id) { setDocsLoading(false); return; }
      const {data} = await supabase.from('candidate_documents').select('*').eq('candidate_id', candidate.id).order('created_at', {ascending: false});
      setDocs(data || []);
      setDocsLoading(false);
    })();
  }, [candidate.id]);

  const generate = async () => {
    setLoading(true); setError(null); setResult(null);
    try {
      // 1. Fetch CV
      let cvBlob = null;
      if (cvUrl) {
        try { const r = await fetch(cvUrl); cvBlob = await r.blob(); } catch(e) {}
      }

      const formData = new FormData();
      if (cvBlob) {
        formData.append('cv', cvBlob, 'cv.pdf');
      } else {
        const textContent = `Candidato: ${candidate.name}\nLinkedIn: ${candidate.linkedin_url||'N/A'}\nEmail: ${candidate.email||'N/A'}`;
        formData.append('cv', new Blob([textContent], {type:'text/plain'}), 'candidato.txt');
      }

      // 2. Fetch and append each additional doc
      let extraIndex = 0;
      for (const doc of docs) {
        try {
          const r = await fetch(doc.url);
          const blob = await r.blob();
          const ext = doc.name.split('.').pop() || 'pdf';
          formData.append(`extra_${extraIndex}`, blob, doc.name || `doc_${extraIndex}.${ext}`);
          formData.append(`extra_${extraIndex}_label`, doc.type.replace(/_/g, ' '));
          extraIndex++;
        } catch(e) { /* skip unfetchable doc */ }
      }

      // 3. Candidate general notes
      if (candidate.notes) {
        formData.append('candidate_notes', candidate.notes);
      }

      formData.append('lang', lang);
      formData.append('position', posLabel);
      formData.append('jd', jd);

      // 4. Presentation notes (salary, availability, recruiter notes)
      const notesPayload = [
        recruiterNotes ? `NOTAS DEL RECRUITER:\n${recruiterNotes}` : '',
        presEdit.salary ? `SALARIO PRETENDIDO: ${presEdit.salary}` : '',
        presEdit.availability ? `DISPONIBILIDAD: ${presEdit.availability}` : '',
      ].filter(Boolean).join('\n\n');
      formData.append('notes', notesPayload);

      const res = await fetch('https://hwg-app.vercel.app/api/generate', { method:'POST', body:formData });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const raw = (data.content||[]).map(c=>c.text||'').join('').replace(/\`\`\`json|\`\`\`/g,'').trim();
      const parsed = JSON.parse(raw);

      if (!parsed.personal) parsed.personal = {};
      parsed.personal.position = posLabel;
      parsed.personal.presentation_date = today;
      if (!parsed.personal.linkedin) parsed.personal.linkedin = candidate.linkedin_url || '';
      if (!parsed.personal.phone && candEdit.phone) parsed.personal.phone = candEdit.phone;
      if (!parsed.personal.email && candEdit.email) parsed.personal.email = candEdit.email;
      if (presEdit.salary) parsed.personal.salary = presEdit.salary;
      if (presEdit.availability) parsed.personal.availability = presEdit.availability;
      if (!parsed.location && candEdit.location) parsed.location = candEdit.location;
      if (recruiterNotes) parsed.extra_notes = recruiterNotes;

      setResult(parsed);
    } catch(e) {
      setError(e.message || 'Error al generar. Intentá de nuevo.');
    } finally { setLoading(false); }
  };

  const downloadWord = async () => {
    if (!result) return;
    try {
      const res = await fetch('https://hwg-app.vercel.app/api/docx', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({data:result, lang, today})
      });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=`${candidate.name.replace(/\s+/g,'_')}_HWG.docx`; a.click();
      URL.revokeObjectURL(url);
    } catch(e) { alert('Error al descargar'); }
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:740,maxHeight:'92vh',overflowY:'auto'}}>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
          <div>
            <div className="modal-title" style={{marginBottom:2}}>Presentar candidato</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>{posLabel}</div>
          </div>
          <button className="btn-ghost" style={{padding:'4px 10px',fontSize:11}} onClick={onClose}>✕</button>
        </div>

        {/* Sección 1: Datos del candidato */}
        <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',fontWeight:600,marginBottom:12}}>1 · Datos del candidato</div>
          <div className="form-row">
            <div>
              <label className="field-label">Nombre completo</label>
              <input className="field-input" style={{marginBottom:0}} value={candEdit.name} onChange={e=>setCandEdit(c=>({...c,name:e.target.value}))}/>
            </div>
            <div>
              <label className="field-label">Ubicación</label>
              <input className="field-input" style={{marginBottom:0}} value={candEdit.location} onChange={e=>setCandEdit(c=>({...c,location:e.target.value}))} placeholder="Ej: Buenos Aires, Argentina"/>
            </div>
          </div>
          <div className="form-row" style={{marginTop:10}}>
            <div>
              <label className="field-label">Teléfono</label>
              <input className="field-input" style={{marginBottom:0}} value={candEdit.phone} onChange={e=>setCandEdit(c=>({...c,phone:e.target.value}))} placeholder="+54 11 1234-5678"/>
            </div>
            <div>
              <label className="field-label">Email</label>
              <input className="field-input" style={{marginBottom:0}} value={candEdit.email} onChange={e=>setCandEdit(c=>({...c,email:e.target.value}))} placeholder="email@ejemplo.com"/>
            </div>
          </div>
        </div>

        {/* Sección 2: Datos de la presentación */}
        <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',fontWeight:600,marginBottom:12}}>2 · Presentación</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
            <div>
              <label className="field-label">Posición</label>
              <input className="field-input" style={{marginBottom:0,background:'#f0eef8',color:'var(--sub)'}} value={posLabel} readOnly/>
            </div>
            <div>
              <label className="field-label">Fecha</label>
              <input className="field-input" style={{marginBottom:0,background:'#f0eef8',color:'var(--sub)'}} value={today} readOnly/>
            </div>
            <div>
              <label className="field-label">Salario pretendido <span style={{color:'var(--muted)',fontWeight:400}}>opcional</span></label>
              <input className="field-input" style={{marginBottom:0}} value={presEdit.salary} onChange={e=>setPresEdit(p=>({...p,salary:e.target.value}))} placeholder="Ej: USD 4.000"/>
            </div>
          </div>
          <div style={{marginTop:10}}>
            <label className="field-label">Disponibilidad <span style={{color:'var(--muted)',fontWeight:400}}>opcional</span></label>
            <input className="field-input" style={{marginBottom:0}} value={presEdit.availability} onChange={e=>setPresEdit(p=>({...p,availability:e.target.value}))} placeholder="Ej: Inmediata / 2 semanas / 1 mes"/>
          </div>
        </div>

        {/* Sección 3: Notas del recruiter */}
        <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',fontWeight:600,marginBottom:12}}>3 · Notas de entrevista</div>
          <textarea className="field-textarea" style={{marginBottom:8,minHeight:90}}
            placeholder="Pegá la transcripción de Otter/Fathom/Zoom, o escribí tus notas de la entrevista..."
            value={recruiterNotes} onChange={e=>setRecruiterNotes(e.target.value)}/>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <label className="btn-ghost" style={{cursor:'pointer',fontSize:11,padding:'6px 14px'}}>
              {notesFileLoading ? 'Leyendo archivo...' : '📎 Subir archivo de notas'}
              <input type="file" accept=".txt,.pdf,.doc,.docx" style={{display:'none'}} onChange={async(e)=>{
                const f=e.target.files[0]; if(!f) return;
                setNotesFileLoading(true);
                try {
                  if(f.name.endsWith('.txt')) {
                    const text = await f.text();
                    setRecruiterNotes(n => n ? n + '\n\n' + text : text);
                  } else {
                    const fd = new FormData();
                    fd.append('file', f);
                    const res = await fetch('https://hwg-app.vercel.app/api/extract-text', {method:'POST', body:fd});
                    const data = await res.json();
                    if(data.text) setRecruiterNotes(n => n ? n + '\n\n' + data.text : data.text);
                    else alert('No se pudo leer el archivo. Probá pegando el texto directamente.');
                  }
                } catch(err) { alert('Error leyendo archivo: ' + err.message); }
                setNotesFileLoading(false);
              }}/>
            </label>
            {recruiterNotes && <span style={{fontSize:10,color:'var(--muted)'}}>{recruiterNotes.length} caracteres cargados</span>}
          </div>
          <div style={{marginTop:10}}>
            {/* Resumen de contexto que se manda a Claude */}
            <div style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',fontWeight:600,marginBottom:8}}>Contexto que usará Claude</div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {!cvUrl
                ? <div style={{fontSize:11,color:'var(--warning)'}}>⚠ Sin CV — usará LinkedIn y notas</div>
                : <div style={{fontSize:11,color:'var(--lime)'}}>✓ CV del candidato</div>
              }
              {!jd
                ? <div style={{fontSize:11,color:'var(--warning)'}}>⚠ Sin JD — la posición no tiene descripción cargada</div>
                : <div style={{fontSize:11,color:'var(--lime)'}}>✓ Job Description de la posición</div>
              }
              {candidate.notes
                ? <div style={{fontSize:11,color:'var(--lime)'}}>✓ Notas generales del candidato</div>
                : <div style={{fontSize:11,color:'var(--muted)'}}>— Sin notas generales del candidato</div>
              }
              {docsLoading
                ? <div style={{fontSize:11,color:'var(--muted)'}}>Cargando documentos adicionales...</div>
                : docs.length > 0
                  ? docs.map(d => <div key={d.id} style={{fontSize:11,color:'var(--lime)'}}>✓ {d.type.replace(/_/g,' ')}: {d.name}</div>)
                  : <div style={{fontSize:11,color:'var(--muted)'}}>— Sin documentos adicionales</div>
              }
            </div>
          </div>
        </div>

        {/* Idioma */}
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
          <div style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',fontWeight:600}}>Idioma de salida</div>
          <button className="btn-ghost" style={{padding:'6px 14px',fontSize:11,background:lang==='es'?'var(--v)':'',color:lang==='es'?'#fff':'var(--sub)',borderColor:lang==='es'?'var(--v)':''}} onClick={()=>setLang('es')}>🇦🇷 Español</button>
          <button className="btn-ghost" style={{padding:'6px 14px',fontSize:11,background:lang==='en'?'var(--v)':'',color:lang==='en'?'#fff':'var(--sub)',borderColor:lang==='en'?'var(--v)':''}} onClick={()=>setLang('en')}>🇺🇸 English</button>
        </div>

        {error && <div className="error-msg">{error}</div>}
        {!result && (
          <button className="btn-primary" style={{width:'100%',padding:14,fontSize:13}} onClick={generate} disabled={loading}>
            {loading ? '⏳ Generando presentación...' : '✨ Generar presentación con Claude'}
          </button>
        )}

        {result && (
          <div style={{marginTop:8}}>
            <div style={{background:'var(--v-light)',border:'1px solid #ddd6fe',borderRadius:8,padding:16,marginBottom:16}}>
              <div style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--v)',fontWeight:600,marginBottom:12}}>Resultado generado</div>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                {[
                  ['Nombre', result.name],
                  ['Ubicación', result.location],
                  ['Email', result.personal?.email],
                  ['Teléfono', result.personal?.phone],
                  ['LinkedIn', result.personal?.linkedin],
                  ['Posición', result.personal?.position],
                  ['Fecha', result.personal?.presentation_date],
                  ['Salario pretendido', result.personal?.salary],
                  ['Disponibilidad', result.personal?.availability || result.snapshot?.avail],
                ].filter(([,v])=>v).map(([k,v])=>(
                  <div key={k} style={{fontSize:11}}>
                    <span style={{color:'var(--muted)',fontSize:9,letterSpacing:1,textTransform:'uppercase'}}>{k}: </span>
                    <span style={{color:'var(--text)',fontWeight:500}}>{v}</span>
                  </div>
                ))}
              </div>

              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
                {result.snapshot && Object.entries(result.snapshot).map(([k,v])=>(
                  <div key={k} style={{background:'#fff',border:'1px solid #ddd6fe',borderRadius:4,padding:'4px 10px',fontSize:11}}>
                    <span style={{color:'var(--muted)',fontSize:9}}>{k}: </span>
                    <span style={{color:'var(--v)',fontWeight:600}}>{v}</span>
                  </div>
                ))}
              </div>

              {result.tools && result.tools.length > 0 && (
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',marginBottom:6}}>Stack técnico</div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    {result.tools.map((t,i)=>(
                      <div key={i} style={{background:'#fff',border:'1px solid #ddd6fe',borderRadius:4,padding:'3px 8px',fontSize:11}}>
                        <strong style={{color:'var(--text)'}}>{t.tool}</strong>
                        {t.years&&<span style={{color:'var(--muted)'}}> · {t.years}y</span>}
                        {t.level&&<span style={{color:'var(--v-mid)'}}> · {t.level}</span>}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {result.storytelling && (
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',marginBottom:6}}>Por qué es fit</div>
                  <div style={{fontSize:12,color:'var(--text)',lineHeight:1.7,background:'#fff',padding:12,borderRadius:6,border:'1px solid #ddd6fe'}}>{result.storytelling}</div>
                </div>
              )}

              {result.gap && (
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:'var(--warning)',marginBottom:6}}>Gap analysis</div>
                  <div style={{fontSize:12,color:'var(--text)',lineHeight:1.7,background:'#fffbeb',padding:12,borderRadius:6,border:'1px solid #fde68a'}}>{result.gap}</div>
                </div>
              )}

              {result.extra_notes && (
                <div>
                  <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:'var(--sub)',marginBottom:6}}>Notas del recruiter</div>
                  <div style={{fontSize:12,color:'var(--text)',lineHeight:1.7,background:'#fff',padding:12,borderRadius:6,border:'1px solid #ddd6fe'}}>{result.extra_notes}</div>
                </div>
              )}
            </div>

            <div style={{display:'flex',gap:8}}>
              <button className="btn-primary" style={{flex:1,padding:12}} onClick={downloadWord}>⬇ Descargar Word</button>
              <button className="btn-ghost" style={{padding:12,fontSize:11}} onClick={()=>setResult(null)}>Regenerar</button>
              <button className="btn-ghost" style={{padding:12,fontSize:11}} onClick={onClose}>Cerrar</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


function AddToPositionModal({ onClose, onSave, positions, existingPositionIds }) {
  const [posId,setPosId]=useState(''); const [status,setStatus]=useState('sourced'); const [notes,setNotes]=useState('');
  const available = (positions||[]).filter(p=>p.status==='active'&&!existingPositionIds.includes(p.id));
  return (
    <Modal title="Agregar a posición" onClose={onClose}>
      <label className="field-label">Posición</label>
      <select className="field-select" value={posId} onChange={e=>setPosId(e.target.value)}>
        <option value="">Seleccionar...</option>
        {available.map(p=><option key={p.id} value={p.id}>{p.clients?.name} — {p.role}</option>)}
      </select>
      <label className="field-label">Estado</label>
      <select className="field-select" value={status} onChange={e=>setStatus(e.target.value)}>
        {STATUSES.map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
      </select>
      <label className="field-label">Notas</label>
      <textarea className="field-textarea" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Contexto..."/>
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn-primary" onClick={()=>posId&&onSave(posId,status,notes)}>Agregar</button>
      </div>
    </Modal>
  );
}

// ── OWNER DASHBOARD ───────────────────────────────────────────────────────────
function OwnerDashboard({ user, users }) {
  const [positions,setPositions]=useState([]); const [clients,setClients]=useState([]); const [alerts,setAlerts]=useState([]); const [loading,setLoading]=useState(true);
  useEffect(()=>{
    (async()=>{
      const [{data:pos},{data:cl}]=await Promise.all([
        supabase.from('positions').select('*, clients(name)').eq('status','active').order('opened_at',{ascending:false}),
        supabase.from('clients').select('*').eq('status','active')
      ]);
      setPositions(pos||[]); setClients(cl||[]);
      const {data:apps}=await supabase.from('applications').select('*, positions(role,clients(name)), candidates(name)').not('status','in','("hired","rechazado_salario","rechazado_tech","rechazado_location")').order('last_updated',{ascending:true});
      setAlerts((apps||[]).filter(a=>(Date.now()-new Date(a.last_updated))/3600000>=72));
      setLoading(false);
    })();
  },[]);
  if (loading) return <div className="loading">Cargando...</div>;
  return (
    <div>
      <div className="page-title">Dashboard</div>
      <div className="page-sub">Vista general HWG</div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-num">{positions.length}</div><div className="stat-label">Posiciones activas</div></div>
        <div className="stat-card"><div className="stat-num">{clients.length}</div><div className="stat-label">Clientes activos</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:alerts.length>0?'#ef4444':'var(--lime)'}}>{alerts.length}</div><div className="stat-label">Alertas 72h</div></div>
        <div className="stat-card"><div className="stat-num">{users.filter(u=>u.role==='recruiter').length}</div><div className="stat-label">Recruiters</div></div>
      </div>
      {alerts.length>0&&(
        <div style={{marginBottom:32}}>
          <div className="section-title" style={{color:'var(--warning)',marginBottom:12}}>⚠ Sin movimiento</div>
          {alerts.map(a=>{
            const h=Math.floor((Date.now()-new Date(a.last_updated))/3600000);
            return (
              <div key={a.id} className={`alert-card ${h>=96?'red':''}`}>
                <div>
                  <div className={`alert-text ${h>=96?'red':''}`} style={{fontWeight:600}}>{a.candidates?.name} — {a.positions?.role}</div>
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{a.positions?.clients?.name} · <StagePill status={a.status}/></div>
                </div>
                <HoursAgo ts={a.last_updated}/>
              </div>
            );
          })}
        </div>
      )}
      <div className="section-title">Posiciones activas</div>
      <table className="data-table">
        <thead><tr><th>Cliente</th><th>Rol</th><th>Location</th><th>Salary</th><th>Vacantes</th><th>Estado</th></tr></thead>
        <tbody>{positions.map(p=>(
          <tr key={p.id}>
            <td><span className="client-name">{p.clients?.name}</span></td>
            <td>{p.role}</td>
            <td style={{color:'var(--sub)',fontSize:11}}>{p.location}</td>
            <td style={{color:'var(--lime)',fontSize:11}}>{p.salary_band}</td>
            <td style={{fontWeight:700,color:'var(--lime)'}}>{p.vacancies}</td>
            <td><StatusBadge status={p.status}/></td>
          </tr>
        ))}</tbody>
      </table>
    </div>
  );
}

// ── POSITIONS PAGE ────────────────────────────────────────────────────────────
function PositionsPage({ user, users }) {
  const [positions,setPositions]=useState([]); const [clients,setClients]=useState([]); const [filter,setFilter]=useState('active'); const [modal,setModal]=useState(null); const [detail,setDetail]=useState(null); const [loading,setLoading]=useState(true);
  const load = useCallback(async()=>{
    const [{data:pos},{data:cl}]=await Promise.all([
      supabase.from('positions').select('*, clients(name,stakeholder)').order('opened_at',{ascending:false}),
      supabase.from('clients').select('*').eq('status','active')
    ]);
    setPositions(pos||[]); setClients(cl||[]); setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);
  const filtered = filter==='all'?positions:positions.filter(p=>p.status===filter);
  if (detail) return <PositionDetail positionId={detail} user={user} users={users} onBack={()=>setDetail(null)} clients={clients} onRefresh={load}/>;
  if (loading) return <div className="loading">Cargando...</div>;
  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Posiciones</div><div className="page-sub">{filtered.length} posiciones</div></div>
        {user.role==='owner'&&<button className="btn-primary" onClick={()=>setModal('new')}>+ Nueva posición</button>}
      </div>
      <div className="filter-row">
        {['active','on_hold','closed','cancelled','all'].map(s=>(
          <div key={s} onClick={()=>setFilter(s)} style={{padding:'6px 14px',border:`1px solid ${filter===s?'var(--lime)':'#2a2a2a'}`,color:filter===s?'var(--lime)':'#555',cursor:'pointer',fontSize:10,letterSpacing:1,textTransform:'uppercase',transition:'all 0.15s'}}>{s}</div>
        ))}
      </div>
      <table className="data-table">
        <thead><tr><th>Cliente</th><th>Rol</th><th>Location</th><th>Salary</th><th>Vacantes</th><th>Estado</th><th>Abierta</th></tr></thead>
        <tbody>{filtered.map(p=>(
          <tr key={p.id} onClick={()=>setDetail(p.id)}>

// ── POSITION DETAIL ───────────────────────────────────────────────────────────
function PositionDetail({ positionId, user, users, onBack, clients, onRefresh }) {
  const [pos,setPos]=useState(null); const [apps,setApps]=useState([]); const [modal,setModal]=useState(null); const [candProfile,setCandProfile]=useState(null); const [allPositions,setAllPositions]=useState([]);
  const load = useCallback(async()=>{
    const [{data:p},{data:a},{data:ap}]=await Promise.all([
      supabase.from('positions').select('*, clients(*)').eq('id',positionId).single(),
      supabase.from('applications').select('*, candidates(*), users(name)').eq('position_id',positionId).order('last_updated',{ascending:false}),
      supabase.from('positions').select('*, clients(name)')
    ]);
    setPos(p); setApps(a||[]); setAllPositions(ap||[]);
  },[positionId]);
  useEffect(()=>{load();},[load]);
  const updateStatus = async (appId, newStatus, oldStatus) => {
    await supabase.from('applications').update({status:newStatus,last_updated:new Date().toISOString()}).eq('id',appId);
    await supabase.from('status_history').insert([{application_id:appId,old_status:oldStatus,new_status:newStatus,changed_by:user.id}]);
    if (newStatus==='hired' && oldStatus!=='hired') {
      const newVacancies = (pos.vacancies||1) - 1;
      if (newVacancies <= 0) {
        await supabase.from('positions').update({status:'closed',vacancies:0}).eq('id',pos.id);
      } else {
        await supabase.from('positions').update({vacancies:newVacancies}).eq('id',pos.id);
      }
    }
    if (oldStatus==='hired' && newStatus!=='hired') {
      await supabase.from('positions').update({vacancies:(pos.vacancies||0)+1, status:'active'}).eq('id',pos.id);
    }
    load();
  };
  const deletePosition = async () => {
    if (!confirm('¿Borrar esta posición y todas sus aplicaciones?')) return;
    await supabase.from('applications').delete().eq('position_id',pos.id);
    await supabase.from('position_recruiters').delete().eq('position_id',pos.id);
    await supabase.from('positions').delete().eq('id',pos.id);
    onBack(); onRefresh();
  };
  if (candProfile) return <CandidateProfile candidate={candProfile} onBack={()=>setCandProfile(null)} currentUser={user} allPositions={allPositions}/>;
  if (!pos) return <div className="loading">Cargando...</div>;
  return (
    <div>
      <div className="back-btn" onClick={onBack}>← Volver a posiciones</div>
      <div className="detail-header">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'var(--lime)',marginBottom:4}}>{pos.clients?.name}</div>
            <div style={{fontSize:24,fontWeight:800,marginBottom:8}}>{pos.role}</div>
            <StatusBadge status={pos.status}/>
          </div>
          {user.role==='owner'&&(
            <div style={{display:'flex',gap:8}}>
              <button className="btn-ghost" onClick={()=>setModal('editPos')}>Editar</button>
              <button className="btn-danger" onClick={deletePosition}>Borrar</button>
            </div>
          )}
        </div>
        <div className="detail-grid" style={{marginTop:20}}>
          <div className="detail-item"><label>Location</label><span>{pos.location||'—'}</span></div>
          <div className="detail-item"><label>Salary Band</label><span style={{color:'var(--lime)'}}>{pos.salary_band||'—'}</span></div>
          <div className="detail-item"><label>Vacantes</label><span>{pos.vacancies}</span></div>
          <div className="detail-item"><label>Abierta</label><span>{pos.opened_at?.slice(0,10)}</span></div>
          <div className="detail-item"><label>Stakeholder</label><span>{(()=>{ try { const p=JSON.parse(pos.clients?.stakeholder); return Array.isArray(p)?p.map(s=>s.name).join(', '):pos.clients?.stakeholder; } catch(e){ return pos.clients?.stakeholder||'—'; }})()}</span></div>
        </div>
        {pos.jd&&<div style={{fontSize:11,color:'var(--muted)',padding:'12px',background:'var(--card)',border:'1px solid var(--border)',whiteSpace:'pre-wrap'}}>{pos.jd}</div>}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="section-title">Candidatos ({apps.length})</div>
        <button className="btn-primary" onClick={()=>setModal('addCand')}>+ Agregar candidato</button>
      </div>
      {apps.length===0
        ? <div className="empty-state">Sin candidatos aún</div>
        : <div className="candidates-list">
            {apps.map(a=>(
              <div key={a.id} className="candidate-row" style={{flexWrap:'wrap',gap:8}}>
                <div style={{flex:1,cursor:'pointer'}} onClick={()=>setCandProfile(a.candidates)}>
                  <div className="candidate-name" style={{color:'var(--lime)'}}>{a.candidates?.name} ↗</div>
                  <div className="candidate-info">
                    {a.candidates?.email&&<span>{a.candidates.email} · </span>}
                    <span style={{color:'var(--sub)'}}>{a.users?.name}</span>
                  </div>
                  {a.notes&&<div style={{fontSize:11,color:'var(--sub)',marginTop:4,fontStyle:'italic'}}>"{a.notes}"</div>}
                  <div style={{marginTop:4}}><HoursAgo ts={a.last_updated}/></div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <select style={{background:'var(--bg)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',fontFamily:'Inter',fontSize:11,outline:'none',cursor:'pointer'}}
                    value={a.status} onChange={e=>updateStatus(a.id,e.target.value,a.status)}>
                    {STATUSES.map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
                  </select>
                  {a.candidates?.cv_url&&<a href={a.candidates.cv_url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:'var(--lime)',textDecoration:'none',border:'1px solid var(--lime)',padding:'4px 8px'}}>CV</a>}
                  {a.candidates?.linkedin_url&&<a href={`https://${a.candidates.linkedin_url.replace('https://','')}`} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:'#3b82f6',textDecoration:'none',border:'1px solid #3b82f6',padding:'4px 8px'}}>LI</a>}
                </div>
              </div>
            ))}
          </div>
      }
      {modal==='addCand'&&<CandidateModal onClose={()=>setModal(null)} onSave={()=>{setModal(null);load();}} positions={[pos]} currentUser={user}/>}
      {modal==='editPos'&&<PositionModal onClose={()=>setModal(null)} onSave={()=>{setModal(null);load();onRefresh();}} initial={pos} clients={clients} users={users}/>}
    </div>
  );
}

// ── CLIENTS PAGE ──────────────────────────────────────────────────────────────
function ClientsPage({ user, users }) {
  const [clients,setClients]=useState([]); const [modal,setModal]=useState(null); const [editing,setEditing]=useState(null); const [loading,setLoading]=useState(true); const [profile,setProfile]=useState(null);
  const load = useCallback(async()=>{ const {data}=await supabase.from('clients').select('*').order('name'); setClients(data||[]); setLoading(false); },[]);
  useEffect(()=>{load();},[load]);
  const deleteClient = async (c,e) => {
    e.stopPropagation();
    if (!confirm(`¿Borrar cliente ${c.name}?`)) return;
    await supabase.from('clients').delete().eq('id',c.id);
    load();
  };
  const parseFirstSH = (raw) => {
    if (!raw) return '—';
    try { const p=JSON.parse(raw); return Array.isArray(p)&&p.length?p[0].name:raw; }
    catch(e) { return raw; }
  };
  if (profile) return <ClientView user={{name:profile.name, id:profile.id}} onBack={()=>setProfile(null)}/>;
  if (loading) return <div className="loading">Cargando...</div>;
  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Clientes</div><div className="page-sub">{clients.length} clientes</div></div>
        {user.role==='owner'&&<button className="btn-primary" onClick={()=>{setEditing(null);setModal('new')}}>+ Nuevo cliente</button>}
      </div>
      <table className="data-table">
        <thead><tr><th>Empresa</th><th>Stakeholder principal</th><th>Estado</th><th></th></tr></thead>
        <tbody>{clients.map(c=>(
          <tr key={c.id} onClick={()=>setProfile(c)} style={{cursor:'pointer'}}>
            <td><span className="client-name">{c.name}</span></td>
            <td style={{color:'var(--muted)',fontSize:12}}>{parseFirstSH(c.stakeholder)}</td>
            <td><StatusBadge status={c.status}/></td>
            <td onClick={e=>e.stopPropagation()}>
              {user.role==='owner'&&(
                <div style={{display:'flex',gap:6}}>
                  <button className="btn-ghost" style={{padding:'4px 10px',fontSize:10}} onClick={e=>{e.stopPropagation();setEditing(c);setModal('edit')}}>Editar</button>

                </div>
              )}

          </tr>
        ))}</tbody>
      </table>
      {(modal==='new'||modal==='edit')&&<ClientModal onClose={()=>setModal(null)} onSave={()=>{setModal(null);load();}} initial={editing}/>}
    </div>
  );
}
